# Import prawdziwych obserwacji z otwartych danych (GBIF / iNaturalist, CC0 i CC BY) dla ~40 miast Europy.
# Ręcznie: Actions → Import open data → Run workflow. Automatycznie: w każdy poniedziałek.
name: Import open data

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: 'Z ilu ostatnich dni'
        default: '60'
      per_city:
        description: 'Ile obserwacji na miasto (max)'
        default: '25'
      dry_run:
        description: 'Tylko pokaż, nic nie zapisuj'
        type: boolean
        default: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Import
        env:
          SUPABASE_URL: https://jxvjurltvjgcqxvhbfhx.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DAYS: ${{ inputs.days || '30' }}
          PER_CITY: ${{ inputs.per_city || '15' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/import/gbif.mjs
