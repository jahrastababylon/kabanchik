<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2D5843">
<meta name="description" content="Mapa dzikich zwierząt w mieście. Zgłaszaj obserwacje, zbieraj XP i odznaki.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Dzikie Korytarze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
/* Layout: pełnoekranowa mapa, HUD u góry, pasek zakładek z przyciskiem „Zgłoś”, panele jako arkusze od dołu */
:root{
  --bg:#E9EEE6; --surface:#FFFFFF; --surface-2:#F2F5EF; --ink:#14221A; --ink-2:#55665B; --line:#D6DDD1;
  --moss:#2D5843; --moss-ink:#FFFFFF; --moss-soft:#DCE8DF;
  --fox:#E2832B; --fox-ink:#211204; --fox-soft:#FBE7D3;
  --danger:#BE3F2C; --danger-soft:#F8DED8; --ok:#3B8A5A;
  --scrim:rgba(10,20,14,.38); --shadow:0 10px 30px rgba(20,34,26,.16);
  --f-display:'Bricolage Grotesque',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Bricolage Grotesque',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1611; --surface:#17211B; --surface-2:#1E2A23; --ink:#E6EEE8; --ink-2:#9EAEA4; --line:#2B3930;
    --moss:#82C7A0; --moss-ink:#0C1810; --moss-soft:#1F3328;
    --fox:#F29C4B; --fox-ink:#1E1004; --fox-soft:#3A2614;
    --danger:#EC7A64; --danger-soft:#3A1E19; --ok:#7CC39A;
    --scrim:rgba(0,0,0,.55); --shadow:0 10px 30px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1611; --surface:#17211B; --surface-2:#1E2A23; --ink:#E6EEE8; --ink-2:#9EAEA4; --line:#2B3930;
  --moss:#82C7A0; --moss-ink:#0C1810; --moss-soft:#1F3328;
  --fox:#F29C4B; --fox-ink:#1E1004; --fox-soft:#3A2614;
  --danger:#EC7A64; --danger-soft:#3A1E19; --ok:#7CC39A;
  --scrim:rgba(0,0,0,.55); --shadow:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--fox);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}

/* ---------- MAP ---------- */
#map{position:fixed;inset:0;background:var(--bg);z-index:1}
.leaflet-container{font-family:var(--f-body);background:var(--bg)}
/* OSM nie ma ciemnego stylu — w trybie ciemnym przyciemniamy kafelki filtrem */
body.tiles-invert .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.85) saturate(.6)}
.leaflet-tile-pane{filter:saturate(.8)}
.leaflet-bottom{bottom:calc(74px + env(safe-area-inset-bottom,0px))}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 80%,transparent)!important;color:var(--ink-2)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--ink-2)!important}

.pin{position:relative;width:40px;height:40px;border-radius:50%;background:var(--surface);border:3px solid var(--ok);display:grid;place-items:center;font-size:20px;line-height:1;box-shadow:0 4px 10px rgba(0,0,0,.28);transition:transform .15s}
.pin:hover{transform:scale(1.08)}
.pin.d1{border-color:var(--ink-2)} .pin.d2{border-color:var(--fox)} .pin.d3{border-color:var(--danger)}
.pin.mine::after{content:"";position:absolute;right:-3px;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--moss);border:2px solid var(--surface)}
.pin.fresh::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--fox);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{opacity:.9;transform:scale(.8)}to{opacity:0;transform:scale(1.35)}}
.medot{width:18px;height:18px;border-radius:50%;background:var(--fox);border:3px solid #fff;box-shadow:0 0 0 6px color-mix(in srgb,var(--fox) 30%,transparent)}

/* ---------- TOP HUD ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:600;display:flex;flex-direction:column;gap:8px;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.top>*{pointer-events:auto}
.row{display:flex;gap:8px;align-items:center}
.search{position:relative;flex:1;min-width:0}
.search label{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow)}
.search svg{flex:none;color:var(--ink-2)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15px}
.results{position:absolute;left:0;right:0;top:54px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px}
.results button:last-child{border-bottom:0}
.results button:hover{background:var(--surface-2)}
.me{flex:none;display:flex;align-items:center;gap:8px;height:48px;padding:0 12px 0 7px;border:0;border-radius:16px;background:var(--moss);color:var(--moss-ink);box-shadow:var(--shadow)}
.me .lv{position:relative;width:36px;height:36px}
.me .lv b{position:absolute;inset:0;display:grid;place-items:center;font:700 13px var(--f-mono)}
.me .txt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.me .txt span:first-child{font-weight:700;font-size:13px}
.me .txt span:last-child{font:500 11px var(--f-mono);opacity:.85}
.me .streak{display:flex;align-items:center;gap:1px;font:700 12px var(--f-mono);color:var(--fox);margin-left:2px}
.me .streak svg{width:16px;height:16px}
.seg{display:inline-flex;background:var(--surface);border-radius:13px;padding:3px;box-shadow:var(--shadow);gap:2px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:10px;font-weight:600;font-size:13px;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-12px;padding:2px 12px 6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.08);white-space:nowrap}
.chip.on{background:var(--moss);border-color:var(--moss);color:var(--moss-ink)}
.chip select{border:0;background:transparent;font-weight:600;font-size:13px;outline:none;cursor:pointer}
.notice{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;max-width:100%;background:var(--fox-soft);color:var(--ink);border-radius:12px;padding:7px 8px 7px 12px;font-size:12.5px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.notice.err{background:var(--danger-soft)}
.notice button{border:0;background:none;padding:2px;display:grid;color:var(--ink-2)}
.notice button svg{width:16px;height:16px}

.float{position:fixed;z-index:600;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:15px;border:0;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow)}
.empty-note{position:fixed;z-index:590;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom,0px));background:var(--surface);border-radius:999px;padding:8px 14px;font-size:13px;box-shadow:var(--shadow);white-space:nowrap}

/* ---------- TAB BAR ---------- */
.tabbar{position:fixed;z-index:700;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:end;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:5px 0;font-size:11px;font-weight:700;color:var(--ink-2)}
.tab.on{color:var(--moss)}
.tab .dot{position:absolute;top:2px;left:calc(50% + 8px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--fox);color:var(--fox-ink);font:700 10px/16px var(--f-mono)}
.fab{justify-self:center;margin-top:-30px;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;font-size:11px;font-weight:800;color:var(--ink)}
.fab span:first-child{width:62px;height:62px;border-radius:21px;background:var(--fox);color:var(--fox-ink);display:grid;place-items:center;box-shadow:0 10px 22px color-mix(in srgb,var(--fox) 45%,transparent);transition:transform .15s}
.fab:active span:first-child{transform:scale(.94)}
.fab svg{width:30px;height:30px;stroke-width:2.6}

/* ---------- ADD MODE ---------- */
.cross{position:fixed;z-index:610;left:50%;top:50%;transform:translate(-50%,-100%);pointer-events:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.cross::after{content:"";position:absolute;left:50%;bottom:-4px;width:10px;height:5px;margin-left:-5px;border-radius:50%;background:rgba(0,0,0,.35)}
.addbar{position:fixed;z-index:700;left:0;right:0;bottom:0;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);padding-top:16px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;max-width:560px;margin-inline:auto}
.addbar .hint{font-size:14px}
.addbar .zone{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--moss)}
.addbar .zone.new{color:var(--fox)}
body:not(.adding) .cross, body:not(.adding) .addbar{display:none}
body.adding .tabbar, body.adding .float, body.adding .top .row2, body.adding .top .chips, body.adding .empty-note{display:none}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:15px;border:0;font-weight:700;font-size:15px;background:var(--surface-2);color:var(--ink)}
.btn.primary{background:var(--fox);color:var(--fox-ink)}
.btn.moss{background:var(--moss);color:var(--moss-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btn.block{width:100%}
.btns{display:flex;gap:10px}
.btns .btn{flex:1}
.iconbtn{width:38px;height:38px;border-radius:12px;border:0;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}
.iconbtn svg{width:20px;height:20px}

/* ---------- SHEETS ---------- */
.scrim{position:fixed;inset:0;z-index:790;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:800;left:0;right:0;bottom:0;max-width:560px;margin-inline:auto;max-height:88%;display:flex;flex-direction:column;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:0 -14px 40px rgba(0,0,0,.22);transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.85,.25,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet.panel{z-index:650;max-height:calc(100% - 70px - env(safe-area-inset-top,0px))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 18px 10px}
.sheet-head::before{content:"";position:absolute;left:50%;top:7px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line)}
.sheet-head h2{font-size:22px;padding-top:12px}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:20px;padding-top:2px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.sheet.panel .sheet-body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-h h3{font-size:17px}
.sec-h .mono{font-size:12px;color:var(--ink-2)}

/* sighting card */
.sc-head{display:flex;gap:14px;align-items:center}
.sc-ico{flex:none;width:58px;height:58px;border-radius:18px;background:var(--surface-2);display:grid;place-items:center;font-size:32px;border:3px solid var(--ok)}
.sc-ico.d1{border-color:var(--ink-2)} .sc-ico.d2{border-color:var(--fox)} .sc-ico.d3{border-color:var(--danger)}
.sc-head h2{font-size:24px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2)}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta svg{width:15px;height:15px}
.photo{width:100%;max-width:100%;aspect-ratio:4/3;border-radius:16px;background:var(--surface-2);object-fit:cover;display:grid;place-items:center;color:var(--ink-2);font-size:13px}
.tip{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface-2);font-size:13.5px}
.tip.warn{background:var(--danger-soft)}
.tip svg{flex:none;width:20px;height:20px;color:var(--danger)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;font-weight:600}

/* form */
.spgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.spbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px 10px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:13px}
.spbtn .e{font-size:30px;line-height:1}
.spbtn.on{border-color:var(--moss);background:var(--moss-soft)}
.spbtn .new{position:absolute;top:-8px;right:-4px;background:var(--fox);color:var(--fox-ink);font:700 9.5px/1 var(--f-mono);padding:4px 6px;border-radius:7px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-weight:700;font-size:14px}
.input{height:46px;border-radius:13px;border:1px solid var(--line);background:var(--surface-2);padding:0 13px;outline:none;width:100%}
.input:focus{border-color:var(--moss)}
.bchips{display:flex;flex-wrap:wrap;gap:6px}
.bchips .chip{box-shadow:none}
.photo-pick{display:flex;gap:12px;align-items:center}
.photo-pick img{width:72px;height:72px;border-radius:14px;object-fit:cover}
.photo-pick label{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 16px;border-radius:13px;border:1px dashed var(--ink-2);font-weight:600;cursor:pointer}
.photo-pick input{position:absolute;width:1px;height:1px;opacity:0}
.xprev{display:flex;flex-wrap:wrap;gap:6px}
.xprev span{font:700 12px var(--f-mono);padding:5px 9px;border-radius:9px;background:var(--fox-soft);color:var(--ink)}

/* level + progress */
.levelcard{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:20px;background:var(--moss);color:var(--moss-ink)}
.levelcard .top-l{display:flex;align-items:center;gap:14px}
.levelcard h3{font-size:26px}
.levelcard .xp{font:700 14px var(--f-mono);opacity:.9}
.bar{height:10px;border-radius:5px;background:color-mix(in srgb,currentColor 18%,transparent);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--fox);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:10.5px;font-weight:700}
.ladder div{display:flex;flex-direction:column;gap:3px;opacity:.55}
.ladder div.on{opacity:1}
.ladder i{height:4px;border-radius:2px;background:currentColor}
.ladder span:last-child{font-family:var(--f-mono);font-weight:500}

/* atlas */
.atlas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.atl{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 6px 12px;border-radius:16px;background:var(--surface-2);text-align:center}
.atl .e{font-size:34px;line-height:1.1}
.atl b{font-size:13.5px}
.atl .mono{font-size:11px;color:var(--ink-2)}
.atl.locked .e{filter:grayscale(1) brightness(.2);opacity:.35}
:root[data-theme="dark"] .atl.locked .e{filter:grayscale(1) brightness(2.2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .atl.locked .e{filter:grayscale(1) brightness(2.2)}}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.medal{width:62px;height:62px;display:grid;place-items:center;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);background:var(--fox);color:var(--fox-ink)}
.medal svg{width:28px;height:28px}
.badge b{font-size:12.5px;line-height:1.2}
.badge small{font-size:11px;color:var(--ink-2);line-height:1.25}
.badge.locked .medal{background:var(--surface-2);color:var(--ink-2);outline:0}
.badge.locked b{color:var(--ink-2)}
.rules{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14px}
.rules span:nth-child(even){font:700 13px var(--f-mono);color:var(--moss);text-align:right}

/* quests */
.streakcard{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:20px;background:var(--fox-soft)}
.streakcard .big{display:flex;align-items:center;gap:12px}
.streakcard .big b{font:700 44px/1 var(--f-mono);color:var(--fox)}
.streakcard .big svg{width:40px;height:40px;color:var(--fox)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:11px;font-weight:700;color:var(--ink-2)}
.days i{display:block;height:30px;border-radius:9px;border:2px dashed color-mix(in srgb,var(--ink-2) 50%,transparent);margin-bottom:4px}
.days .on i{background:var(--fox);border:2px solid var(--fox)}
.days .today i{border-color:var(--ink)}
.quest{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--surface-2)}
.quest .qi{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--surface);color:var(--moss)}
.quest b{display:block;font-size:14.5px;margin-bottom:7px}
.quest .bar{height:7px;color:var(--ink)}
.quest .bar i{background:var(--moss)}
.quest .mono{font-size:13px;font-weight:700}
.quest.done{background:var(--moss-soft)}
.quest.done .qi{background:var(--moss);color:var(--moss-ink)}

/* ranking */
.rank-list{display:flex;flex-direction:column}
.rrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line)}
.rrow .n{font:700 15px var(--f-mono);color:var(--ink-2);text-align:center}
.rrow.top1 .n{color:var(--fox)}
.rrow b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow small{color:var(--ink-2);font-size:12px}
.rrow .x{font:700 15px var(--f-mono)}
.rrow.isme{background:var(--moss-soft);border-radius:12px;border-bottom-color:transparent}

const small = (svg, px = 16) => svg.replace('width="22" height="22"', `width="${px}" height="${px}"`);
function ring(pct, size = 36, stroke = 4){
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, h = size / 2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="${stroke}"/><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="var(--fox)" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c*(1-pct)).toFixed(2)}" transform="rotate(-90 ${h} ${h})"/></svg>`;
}

/* =====================================================================
   WARSTWA DANYCH — Supabase albo demo (localStorage)
   area(b)   → obserwacje w widocznym obszarze mapy
   mine()    → wszystkie moje obserwacje + moje potwierdzenia (do XP i odznak)
   ===================================================================== */
function supaApi(){
  const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  let uid = null;
  const ok = ({ data, error }) => { if(error) throw error; return data; };
  const num = r => ({ ...r, lat:+r.lat, lng:+r.lng });
  return {
    async init(){
      let session = ok(await sb.auth.getSession()).session;
      if(!session) session = ok(await sb.auth.signInAnonymously()).session;
      uid = session.user.id; return uid;
    },
    async species(){ return ok(await sb.from('species').select('id,name_pl,icon,danger_level')); },
    async area(b){ return ok(await sb.rpc('dk_sightings_in_bbox', { p_w:b.w, p_s:b.s, p_e:b.e, p_n:b.n, p_limit:3000 })).map(num); },
    async mine(){
      const [list, conf] = await Promise.all([sb.rpc('dk_my_sightings'), sb.rpc('dk_my_confirmations')]);
      return { list:ok(list).map(num), conf:ok(conf).map(r => new Date(r.created_at).getTime()) };
    },
    async photo(id){ return ok(await sb.from('sightings').select('photo_url').eq('id', id).single()).photo_url; },
    async add(o){
      let photo = o.photo_url;
      if(photo && photo.startsWith('data:')){
        // Zdjęcie idzie do Supabase Storage, w bazie zostaje tylko link.
        // Jeśli magazynu jeszcze nie ma (brak migracji v5), zapisujemy jak dawniej.
        try{
          const blob = await (await fetch(photo)).blob();
          const path = `${uid}/${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}.jpg`;
          ok(await sb.storage.from('photos').upload(path, blob, { contentType:'image/jpeg', upsert:false }));
          photo = sb.storage.from('photos').getPublicUrl(path).data.publicUrl;
        }catch(e){ console.warn('Storage niedostępny, zdjęcie zapisane w bazie:', e.message || e); }
      }
      return ok(await sb.rpc('dk_add_sighting', { p_species:o.species_id, p_lat:o.lat, p_lng:o.lng, p_behavior:o.behavior, p_photo:photo, p_seen_at:o.seen_at }));
    },
    async confirm(id){ ok(await sb.rpc('dk_confirm', { p_sighting:id })); },
    async leaderboard(since, near){ return ok(await sb.rpc('dk_leaderboard', { p_since:since, p_lat:near?.lat ?? null, p_lng:near?.lng ?? null, p_radius_m:near ? near.r : null })); },
    async getNickname(){ const { data } = await sb.from('profiles').select('nickname').eq('id', uid).maybeSingle(); return data?.nickname || ''; },
    async setNickname(n){ ok(await sb.rpc('dk_set_nickname', { p_nickname:n })); },
  };
}

function demoApi(){
  const KEY = 'dk_demo_v4';
  const SPECIES = [
    { id:'dzik', name_pl:'Dzik', icon:'🐗', danger_level:2 },
    { id:'lis', name_pl:'Lis', icon:'🦊', danger_level:0 },
    { id:'sarna', name_pl:'Sarna', icon:'🦌', danger_level:0 },
    { id:'wilk', name_pl:'Wilk', icon:'🐺', danger_level:3 },
    { id:'borsuk', name_pl:'Borsuk', icon:'🦡', danger_level:0 },
    { id:'inne', name_pl:'Inne', icon:'❓', danger_level:1 },
  ];
  const USERS = ['Ania_W','LisiTrop','Marek.N','DzikaKasia','SowaNocna','Petra_LJ','Andreas.CY','Jess_NYC','Olek_MSQ','Rowerzysta'];
  const POOL = ['dzik','dzik','lis','lis','lis','sarna','sarna','borsuk','inne','wilk'];
  const BEH = ['Przechodził','Żerował','Z młodymi','W grupie','Przechodził',null];
  let db = LS.get(KEY, null) || { s:[], clusters:[], gives:{}, nickname:'', conf:[] };
  const save = () => LS.set(KEY, db);
  // Przykładowe dane powstają wokół miejsca, które oglądasz — działa w każdym mieście świata.
  function seedAround(lat, lng){
    const r = rng('demo' + lat.toFixed(2) + ',' + lng.toFixed(2)), k = Math.max(.2, Math.cos(lat * Math.PI / 180));
    for(let h = 0; h < 9; h++){
      const spread = h < 3 ? .014 : .08;  // trzy skupiska tuż obok, reszta w promieniu kilku km
      const hl = lat + (r() - .5) * spread, hg = lng + (r() - .5) * spread / k;
      const main = POOL[Math.floor(r() * POOL.length)], n = 2 + Math.floor(r() * 5);
      for(let i = 0; i < n; i++){
        const sp = r() < .7 ? main : POOL[Math.floor(r() * POOL.length)];
        db.s.push({ id:'d' + db.s.length + '_' + Math.floor(r() * 1e6), species_id:sp,
          lat:hl + (r() - .5) * .004, lng:hg + (r() - .5) * .004 / k, behavior:BEH[Math.floor(r() * BEH.length)],
          photo_url:null, seen_at:new Date(Date.now() - Math.pow(r(), 1.7) * 28 * 864e5).toISOString(),
          author:USERS[Math.floor(r() * USERS.length)], cc:Math.floor(r() * r() * 5) });
      }
    }
    USERS.forEach(u => db.gives[u] = (db.gives[u] || 0) + Math.floor(r() * 6));
    db.clusters.push([lat, lng]); save();
  }
  const view = s => ({ id:s.id, species_id:s.species_id, lat:s.lat, lng:s.lng, behavior:s.behavior, has_photo:!!s.photo_url,
    seen_at:s.seen_at, confirmed_count:s.cc, confirmed_by_me:!!s.byMe, is_mine:s.author === 'me',
    nickname: s.author === 'me' ? (db.nickname || 'Ty') : s.author });
  const inBox = (s, b) => s.lat >= b.s && s.lat <= b.n && (b.w <= b.e ? s.lng >= b.w && s.lng <= b.e : s.lng >= b.w || s.lng <= b.e);
  return {
    async init(){ return 'me'; },
    async species(){ return SPECIES; },
    async area(b){
      const c = [(b.s + b.n) / 2, (b.w + b.e) / 2];
      if(b.z >= 12 && !db.clusters.some(x => dist(x[0], x[1], c[0], c[1]) < 6000)) seedAround(c[0], c[1]);
      return db.s.filter(s => inBox(s, b)).map(view).sort((a, b) => b.seen_at.localeCompare(a.seen_at));
    },
    async mine(){ return { list:db.s.filter(s => s.author === 'me').map(view), conf:db.conf.slice() }; },
    async photo(id){ return db.s.find(x => x.id === id)?.photo_url || null; },
    async add(o){
      const id = 'm' + Date.now().toString(36);
      db.s.push({ id, ...o, author:'me', cc:0 });
      if(!save()){ db.s[db.s.length - 1].photo_url = null; save(); toast('Za mało miejsca w przeglądarce — zapisano bez zdjęcia'); }
      return id;
    },
    async confirm(id){ const s = db.s.find(x => x.id === id); if(s && !s.byMe && s.author !== 'me'){ s.byMe = true; s.cc++; db.conf.push(Date.now()); save(); } },
    async leaderboard(since, near){
      const t = since ? new Date(since).getTime() : 0, by = {};
      const U = a => by[a] ||= { n:0, ph:0, sp:new Set(), cg:0, cr:0 };
      for(const s of db.s){
        if(near && dist(s.lat, s.lng, near.lat, near.lng) > near.r) continue;
        if(new Date(s.seen_at).getTime() < t) continue;
        const u = U(s.author); u.n++; if(s.photo_url) u.ph++; u.sp.add(s.species_id); u.cr += s.cc;
      }
      for(const [a, g] of Object.entries(db.gives)) if(by[a]) by[a].cg = since ? Math.round(g / 4) : g;
      if(by.me || db.conf.length) U('me').cg = db.conf.filter(c => c >= t).length;
      return Object.entries(by).map(([a, u]) => ({
        nickname: a === 'me' ? (db.nickname || 'Ty') : a,
        xp: u.n*XP.sighting + u.ph*XP.photo + u.sp.size*XP.newSpecies + u.cg*XP.confirmGiven + u.cr*XP.confirmReceived,
        sightings: u.n, species: u.sp.size, is_me: a === 'me',
      })).filter(x => x.xp > 0).sort((a, b) => b.xp - a.xp).slice(0, 50);
    },
    async getNickname(){ return db.nickname || ''; },
    async setNickname(n){ db.nickname = n; save(); },
  };
}

const S = {

  nickname:'', adding:false, pick:null, tab:'map', rankPeriod:'week', rankScope:'near',

let API;

function myStats(){
  const my = S.mine;
  const species = new Set(my.map(s => s.species_id));
  const photos = my.filter(s => s.has_photo).length;
  const given = S.myConf.length;
  const received = my.reduce((a, s) => a + (s.confirmed_count || 0), 0);
  const xp = my.length*XP.sighting + photos*XP.photo + species.size*XP.newSpecies + given*XP.confirmGiven + received*XP.confirmReceived;
  const cells = new Set(my.map(s => cellOf(s.lat, s.lng).id));
  let far = 0;
  outer: for(let i = 1; i < my.length; i++) for(let j = 0; j < i; j++) if(dist(my[i].lat, my[i].lng, my[j].lat, my[j].lng) > 50000){ far = 1; break outer; }
  return { my, species, photos, given, received, xp, cells, far, streak:streakOf(my) };
}
function streakOf(my){
  const days = new Set(my.map(s => dayKey(s.seen_at)));
  const d = new Date(); if(!days.has(dayKey(d))) d.setDate(d.getDate() - 1);
  let n = 0; while(days.has(dayKey(d))){ n++; d.setDate(d.getDate() - 1); }
  return n;
}
function levelOf(xp){
  let i = 0; LEVELS.forEach((l, k) => { if(xp >= l.xp) i = k; });
  const cur = LEVELS[i], nx = LEVELS[i+1];
  return { idx:i, name:cur.name, next:nx, pct: nx ? (xp - cur.xp) / (nx.xp - cur.xp) : 1, toNext: nx ? nx.xp - xp : 0 };
}
const spIdByName = n => S.species.find(s => s.name_pl === n)?.id;
const hourOf = s => new Date(s.seen_at).getHours();

const unlocked = st => BADGES.filter(b => { const [a, n] = b.prog(st); return a >= n; }).map(b => b.id);

function questCtx(st){
  const ws = weekStart().getTime(), at = s => new Date(s.seen_at).getTime();
  const wk = st.my.filter(s => at(s) >= ws);
  const before = new Set(st.my.filter(s => at(s) < ws).map(s => cellOf(s.lat, s.lng).id));
  const now = new Set(wk.map(s => cellOf(s.lat, s.lng).id));
  return { wk, newCells:[...now].filter(c => !before.has(c)).length, conf:S.myConf.filter(c => c >= ws).length };
}
function weeklyQuests(){
  const r = rng('q' + weekKey());
  const cands = S.species.filter(s => ['Dzik','Lis','Sarna','Borsuk'].includes(s.name_pl));
  const sp = cands[Math.floor(r() * cands.length)];
  const T = [
    { id:'add3',    icon:'paw',     title:'Zgłoś 3 obserwacje',              target:3, p: c => c.wk.length },
    { id:'photo2',  icon:'camera',  title:'Dodaj 2 obserwacje ze zdjęciem',  target:2, p: c => c.wk.filter(s => s.has_photo).length },
    { id:'conf2',   icon:'check',   title:'Potwierdź 2 cudze zgłoszenia',    target:2, p: c => c.conf },
    sp && { id:'sp-'+sp.id, icon:'eye', title:`Wypatrz gatunek: ${sp.name_pl}`, target:1, p: c => c.wk.filter(s => s.species_id === sp.id).length },
    { id:'cells2',  icon:'grid',    title:'Odkryj 2 nowe kwadraty mapy',     target:2, p: c => c.newCells },
    { id:'dusk',    icon:'moon',    title:'Obserwacja po 20:00',             target:1, p: c => c.wk.filter(s => hourOf(s) >= 20).length },
    { id:'variety', icon:'star',    title:'2 różne gatunki w tym tygodniu',  target:2, p: c => new Set(c.wk.map(s => s.species_id)).size },
  ].filter(Boolean);
  for(let i = T.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [T[i], T[j]] = [T[j], T[i]]; }
  return T.slice(0, 3);
}
function questsDone(st = myStats()){ const c = questCtx(st); return weeklyQuests().filter(q => q.p(c) >= q.target).map(q => q.id); }
function markProgress(){
  const st = myStats();
  if(questsDone(st).length === 3){ const w = LS.get('dk_qweeks', []); if(!w.includes(weekKey())){ w.push(weekKey()); LS.set('dk_qweeks', w); } }
}
function snapshot(){
  const st = myStats();
  return { xp:st.xp, level:levelOf(st.xp).idx, badges:new Set(unlocked(st)), quests:new Set(questsDone(st)), cells:new Set(st.cells), species:new Set(st.species) };
}

/* =====================================================================
   MAPA — cały świat
   ===================================================================== */
let map, tiles, markers, heat = null, cellsLayer, meDot = null;
const ATTR_OSM = '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
function providers(dark){
  const list = [];
  if(CONFIG.CUSTOM_TILES) list.push({ url:CONFIG.CUSTOM_TILES, opts:{ attribution:CONFIG.CUSTOM_ATTRIBUTION || ATTR_OSM }, invert:false });
  if(CONFIG.CARTO_KEY) list.push({ url:`https://{s}.basemaps.cartocdn.com/${dark ? 'dark_all' : 'rastertiles/voyager'}/{z}/{x}/{y}{r}.png?key=${encodeURIComponent(CONFIG.CARTO_KEY)}`,
    opts:{ subdomains:'abcd', attribution:ATTR_OSM + ' © <a href="https://carto.com/attributions">CARTO</a>' }, invert:false });
  list.push({ url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', opts:{ attribution:ATTR_OSM }, invert:dark });
  return list;
}
function isDark(){ const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
function setTiles(idx = 0){
  const list = providers(isDark()), src = list[idx];
  if(tiles){ map.removeLayer(tiles); tiles = null; }
  if(!src){ notice('Nie udało się wczytać podkładu mapy. Sprawdź internet albo ustaw CARTO_KEY w konfiguracji.', true); return; }
  document.body.classList.toggle('tiles-invert', !!src.invert);
  let okT = 0, errT = 0, moved = false;
  const next = () => { if(moved) return; moved = true; setTiles(idx + 1); };
  tiles = L.tileLayer(src.url, { maxZoom:19, crossOrigin:true, ...src.opts })
    .on('tileload', () => okT++)
    .on('tileerror', () => { if(!okT && ++errT >= 4) next(); })
    .addTo(map);
  setTimeout(() => { if(!okT && tiles) next(); }, 6000);
}
function initialView(){
  const saved = LS.get('dk_view', null);
  if(saved && isFinite(saved.lat)) return saved;
  let tz = ''; try{ tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }catch(e){}
  if(TZ[tz]) return { lat:TZ[tz][0], lng:TZ[tz][1], z:12 };
  if(tz.startsWith('Europe/')) return { lat:50, lng:15, z:5 };
  if(tz.startsWith('America/')) return { lat:39, lng:-98, z:4 };
  return { lat:30, lng:10, z:3 };
}
function initMap(){
  const v = initialView();
  map = L.map('map', { zoomControl:false, minZoom:2, worldCopyJump:true }).setView([v.lat, v.lng], v.z);
  setTiles();
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { setTiles(); renderMap(); });
  markers = L.layerGroup().addTo(map);
  cellsLayer = L.layerGroup();
  map.on('click', e => { if(S.adding) map.panTo(e.latlng); });
  map.on('move', () => { if(S.adding) updatePickHint(); });
  let t; map.on('moveend', () => {
    const c = map.getCenter(); LS.set('dk_view', { lat:c.lat, lng:c.lng, z:map.getZoom() });
    clearTimeout(t); t = setTimeout(() => loadArea().then(renderMap).catch(err => console.error(err)), 350);
  });
}
let areaSeq = 0;
async function loadArea(){
  const b = map.getBounds().pad(.35), seq = ++areaSeq;
  const box = { s:Math.max(-85, b.getSouth()), n:Math.min(85, b.getNorth()), w:wrap(b.getWest()), e:wrap(b.getEast()), z:map.getZoom() };
  if(b.getEast() - b.getWest() >= 360){ box.w = -180; box.e = 180; }
  const list = await API.area(box);
  if(seq === areaSeq) S.area = list;
}
const wrap = x => ((x + 180) % 360 + 360) % 360 - 180;
function visible(){
  const cutoff = S.time === 'all' ? 0 : Date.now() - (+S.time) * 864e5;
  return S.area.filter(s => (S.spFilter.size === 0 || S.spFilter.has(s.species_id)) && new Date(s.seen_at).getTime() >= cutoff);
}
function pinIcon(s){
  const sp = S.spById[s.species_id] || {};
  const fresh = Date.now() - new Date(s.seen_at) < 6 * 3600e3;
  return L.divIcon({ className:'', iconSize:[40,40], iconAnchor:[20,20],
    html:`<div class="pin d${sp.danger_level || 0}${fresh ? ' fresh' : ''}${s.is_mine ? ' mine' : ''}">${esc(sp.icon || '?')}</div>` });
}
function renderMap(){
  if(!map) return;
  markers.clearLayers(); cellsLayer.clearLayers(); map.removeLayer(cellsLayer);
  if(heat){ map.removeLayer(heat); heat = null; }
  const list = visible(), z = map.getZoom();
  let note = '';
  if(S.mode === 'pins'){
    list.forEach(s => L.marker([s.lat, s.lng], { icon:pinIcon(s), keyboard:false, title:(S.spById[s.species_id]?.name_pl || '') })
      .on('click', () => openCard(s.id)).addTo(markers));
    if(!list.length) note = z < 9 ? 'Przybliż mapę do swojego miasta' : 'Nikt tu jeszcze niczego nie zgłosił. Bądź pierwszy!';
  } else if(S.mode === 'heat'){
    if(L.heatLayer && list.length) heat = L.heatLayer(list.map(s => [s.lat, s.lng, .7]), { radius:30, blur:24, maxZoom:15, minOpacity:.3,
      gradient:{ .2:'#7cc39a', .5:'#e9c44a', .8:'#e2832b', 1:'#be3f2c' } }).addTo(map);
    if(!list.length) note = 'Brak danych do mapy cieplnej w tym miejscu';
  } else {
    const moss = css('--moss'), ink2 = css('--ink-2'), vb = map.getBounds().pad(.2);
    const mineCells = new Map(); S.mine.forEach(s => { const c = cellOf(s.lat, s.lng); mineCells.set(c.id, c); });
    const other = new Map(); S.area.forEach(s => { const c = cellOf(s.lat, s.lng); if(!mineCells.has(c.id)) other.set(c.id, c); });
    other.forEach(c => L.rectangle(c.bounds, { color:ink2, weight:1.2, dashArray:'5 6', fillColor:ink2, fillOpacity:.06 }).on('click', () => openCell(c)).addTo(cellsLayer));
    mineCells.forEach(c => { if(vb.contains([c.lat, c.lng])) L.rectangle(c.bounds, { color:moss, weight:2, fillColor:moss, fillOpacity:.3 }).on('click', () => openCell(c)).addTo(cellsLayer); });
    cellsLayer.addTo(map);
    if(z < 12) note = 'Przybliż mapę, żeby zobaczyć kwadraty 1 km';
    else if(!mineCells.size) note = 'Zielone kwadraty to miejsca, które odkryłeś';
  }
  $('#emptyNote').textContent = note; $('#emptyNote').hidden = !note;
}

/* ---------- nazwa miejsca (Nominatim, z pamięcią podręczną) ---------- */
const placeCache = {};
async function placeName(lat, lng){
  const k = lat.toFixed(3) + ',' + lng.toFixed(3);
  if(k in placeCache) return placeCache[k];
  try{
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=15&accept-language=pl&lat=${lat}&lon=${lng}`);
    const a = (await r.json()).address || {};
    const local = a.park || a.nature_reserve || a.suburb || a.quarter || a.neighbourhood || a.village || a.hamlet || '';
    const city = a.city || a.town || a.municipality || a.county || '';
    return placeCache[k] = [local, city].filter(Boolean).filter((x, i, arr) => arr.indexOf(x) === i).join(', ') || a.country || '';
  }catch(e){ return placeCache[k] = ''; }
}

const findSighting = id => S.area.find(x => x.id === id) || S.mine.find(x => x.id === id);

  const risky = (sp.danger_level >= 2) || /Agresywny|Ranny/.test(s.behavior || '');
  const when = new Date(s.seen_at);
  let action;
  if(s.is_mine) action = `<button class="btn block" disabled>To Twoja obserwacja</button>`;
  else if(s.confirmed_by_me) action = `<button class="btn moss block" disabled>${ICON.check} Potwierdzone</button>`;
  else action = `<button class="btn primary block" id="confirmBtn">${ICON.check} Też go widziałem · +${XP.confirmGiven} XP</button>`;
  $('#cardBody').innerHTML = `
    <div class="sc-head"><div class="sc-ico d${sp.danger_level}">${esc(sp.icon)}</div>
      <div><h2>${esc(sp.name_pl)}</h2><div class="meta"><span>${ICON.clock}${ago(s.seen_at)} · ${when.toLocaleString('pl-PL', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })}</span><span id="placeLbl">${ICON.pin}…</span></div></div></div>
    ${s.has_photo ? `<div class="photo" id="photoBox">Ładuję zdjęcie…</div>` : ''}
    <dl class="kv">
      ${s.behavior ? `<dt>Zachowanie</dt><dd>${esc(s.behavior)}</dd>` : ''}
      <dt>Zgłosił(a)</dt><dd>${s.is_mine ? 'Ty' : esc(s.nickname || 'Anonimowy tropiciel')}</dd>

    </dl>
    ${SP_TIPS[sp.name_pl] ? `<div class="tip${risky ? ' warn' : ''}">${ICON.shield}<div>${esc(SP_TIPS[sp.name_pl])}</div></div>` : ''}
    ${action}`;
  openSheet('card');

  const cb = $('#confirmBtn');

    cb.disabled = true; cb.textContent = 'Zapisuję…';

    catch(e){ toast('Nie udało się potwierdzić: ' + (e.message || e)); cb.disabled = false; return; }
    await reload(); closeSheets(); reward(before, 'confirm');

    }catch(e){ const box = $('#photoBox'); if(box) box.textContent = 'Nie udało się wczytać zdjęcia'; }
  }
}

function xpPreview(){
  const st = myStats(), parts = [`Obserwacja +${XP.sighting}`];
  if(F.photo) parts.push(`Zdjęcie +${XP.photo}`);
  if(F.species && !st.species.has(F.species)) parts.push(`Nowy gatunek +${XP.newSpecies}`);
  if(S.pick && !st.cells.has(cellOf(S.pick.lat, S.pick.lng).id)) parts.push('Nowy kwadrat mapy');
  $('#xPrev').innerHTML = parts.map(p => `<span>${esc(p)}</span>`).join('');
  const total = XP.sighting + (F.photo ? XP.photo : 0) + (F.species && !st.species.has(F.species) ? XP.newSpecies : 0);
  $('#fSubmit').textContent = `Zgłoś obserwację · +${total} XP`;
}
function compress(file, max, q){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Nie udało się odczytać zdjęcia. Spróbuj pliku JPG lub PNG.')); };
    img.src = url;
  });
}
async function submitForm(){
  if(!F.species){ toast('Wybierz gatunek'); return; }

  if(isNaN(when)){ toast('Podaj datę i godzinę'); return; }
  if(when > new Date(Date.now() + 60000)){ toast('Data nie może być z przyszłości'); return; }
  if(when < new Date(Date.now() - 7*864e5 - 60000)){ toast('Można zgłosić obserwację sprzed maksymalnie 7 dni'); return; }
  const note = $('#fNote').value.trim();
  const behavior = [[...F.behaviors].join(', '), note].filter(Boolean).join(' — ') || null;
  const btn = $('#fSubmit'); btn.disabled = true; btn.textContent = 'Zapisuję…';
  const before = snapshot(), hadPhoto = !!F.photo, newSp = !before.species.has(F.species);
  try{ await API.add({ species_id:F.species, lat:S.pick.lat, lng:S.pick.lng, behavior, photo_url:F.photo, seen_at:when.toISOString() }); }
  catch(e){ toast('Nie udało się zapisać: ' + (e.message || e)); btn.disabled = false; xpPreview(); return; }
  closeSheets();
  if(S.spFilter.size && !S.spFilter.has(F.species)) S.spFilter.clear();
  if(S.time !== 'all' && Date.now() - when > (+S.time) * 864e5) S.time = '30';
  renderChips(); setMode('pins');
  await reload();
  reward(before, 'add', { photo:hadPhoto, newSpecies:newSp ? F.species : null });
}

/* ---------- nagroda ---------- */
function reward(before, kind, extra = {}){
  markProgress();
  const after = snapshot();
  const gained = after.xp - before.xp;
  const newBadges = BADGES.filter(b => after.badges.has(b.id) && !before.badges.has(b.id));
  const qs = weeklyQuests().filter(q => after.quests.has(q.id) && !before.quests.has(q.id));
  const newCells = [...after.cells].filter(c => !before.cells.has(c)).length;
  const lvUp = after.level > before.level;
  renderAll();
  if(kind === 'confirm' && !newBadges.length && !lvUp && !qs.length){ toast(`+${gained} XP`, 'xp'); return; }

  const lines = [];
  if(kind === 'add'){
    lines.push(['Obserwacja', `+${XP.sighting}`]);
    if(extra.photo) lines.push(['Zdjęcie', `+${XP.photo}`]);
    if(extra.newSpecies){ const sp = S.spById[extra.newSpecies]; lines.push([`Nowy gatunek w atlasie: ${sp?.icon || ''} ${sp?.name_pl || ''}`, `+${XP.newSpecies}`]); }
  } else lines.push(['Potwierdzenie obserwacji', `+${XP.confirmGiven}`]);
  if(newCells) lines.push(['Odkryty nowy kwadrat mapy', `razem ${after.cells.size}`]);
  qs.forEach(q => lines.push([`Wyzwanie: ${q.title}`, 'ukończone']));

  const lb = levelOf(before.xp), la = levelOf(after.xp);
  const startPct = lvUp ? 0 : lb.pct;
  $('#mcard').innerHTML = `
    <div class="gain"><span>${kind === 'add' ? 'Obserwacja zapisana' : 'Dzięki za potwierdzenie'}</span><b id="gainNum">+0</b><span>XP</span></div>
    ${lvUp ? `<div class="lvup"><div class="eyebrow" style="color:inherit;opacity:.8">Nowy poziom</div><b>${la.name}</b></div>` : ''}
    <div class="lines">${lines.map(([a, b]) => `<div><span>${esc(a)}</span><span>${esc(b)}</span></div>`).join('')}</div>
    <div class="mprog"><div style="display:flex;justify-content:space-between;gap:8px"><span>${la.name}</span><span class="mono">${la.next ? `${la.toNext} XP do: ${la.next.name}` : 'Najwyższy poziom'}</span></div><div class="bar"><i id="mBar" style="width:${startPct*100}%"></i></div></div>
    ${newBadges.length ? `<div class="sec"><div class="eyebrow" style="text-align:center">${newBadges.length === 1 ? 'Nowa odznaka' : 'Nowe odznaki'}</div>
      <div class="newbadges">${newBadges.map(b => `<div class="badge"><div class="medal">${ICON[b.icon]}</div><b>${esc(b.name)}</b><small>${esc(b.desc)}</small></div>`).join('')}</div></div>` : ''}
    <button class="btn moss block" id="mOk">Dalej</button>`;
  $('#modal').hidden = false;
  $('#mOk').focus();
  $('#mOk').onclick = () => { $('#modal').hidden = true; };
  requestAnimationFrame(() => requestAnimationFrame(() => { const b = $('#mBar'); if(b) b.style.width = (la.pct * 100) + '%'; }));
  const t0 = performance.now(), el = $('#gainNum');
  const step = t => { const k = Math.min(1, (t - t0) / 700); el.textContent = '+' + Math.round(gained * (1 - Math.pow(1 - k, 3))); if(k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

      <div class="badges">${BADGES.map(b => { const [a, n] = b.prog(st), on = ul.has(b.id); return `<div class="badge${on ? '' : ' locked'}"><div class="medal">${ICON[b.icon]}</div><b>${esc(b.name)}</b><small>${on ? esc(b.desc) : `${esc(b.desc)} · ${Math.min(a, n)}/${n}`}</small></div>`; }).join('')}</div></div>
    <div class="sec"><h3>Za co są punkty</h3><div class="rules">
      <span>Każda obserwacja</span><span>+${XP.sighting}</span>
      <span>Obserwacja ze zdjęciem</span><span>+${XP.photo}</span>
      <span>Pierwszy raz nowy gatunek</span><span>+${XP.newSpecies}</span>
      <span>Potwierdzasz cudzą obserwację</span><span>+${XP.confirmGiven}</span>
      <span>Ktoś potwierdza Twoją</span><span>+${XP.confirmReceived}</span></div></div>`;
  $('#showCells').onclick = () => {
    setTab('map'); setMode('zones');
    if(st.my.length){ const b = L.latLngBounds(st.my.map(s => [s.lat, s.lng])); map.fitBounds(b.pad(.3), { maxZoom:14 }); }
  };
}
async function renderRank(){
  const body = $('#rankBody'), R = CONFIG.NEAR_RADIUS_KM;
  body.innerHTML = `
    <div class="nickrow" id="nickRow"></div>
    <div class="row" style="flex-wrap:wrap">
      <div class="seg" style="box-shadow:none;background:var(--surface-2)">
        <button data-scope="near" class="${S.rankScope === 'near' ? 'on' : ''}">Okolica ${R} km</button>
        <button data-scope="world" class="${S.rankScope === 'world' ? 'on' : ''}">Świat</button></div>
      <div class="seg" style="box-shadow:none;background:var(--surface-2)">
        <button data-p="week" class="${S.rankPeriod === 'week' ? 'on' : ''}">Tydzień</button>
        <button data-p="all" class="${S.rankPeriod === 'all' ? 'on' : ''}">Cały czas</button></div>
    </div>
    <div class="rank-list" id="rankList"><p class="muted">Ładuję ranking…</p></div>
    ${S.rankScope === 'near' ? '<p class="muted" style="margin:0;font-size:12.5px">Okolica liczy się od środka mapy.</p>' : ''}
    ${DEMO ? '<p class="muted" style="margin:0;font-size:12.5px">Tryb demo: pozostali gracze to przykładowe dane.</p>' : ''}`;
  renderNickRow();
  $$('#rankBody [data-p]').forEach(b => b.onclick = () => { S.rankPeriod = b.dataset.p; renderRank(); });
  $$('#rankBody [data-scope]').forEach(b => b.onclick = () => { S.rankScope = b.dataset.scope; renderRank(); });
  try{
    const c = map.getCenter();
    const near = S.rankScope === 'near' ? { lat:c.lat, lng:c.lng, r:R * 1000 } : null;
    const rows = await API.leaderboard(S.rankPeriod === 'week' ? weekStart().toISOString() : null, near);
    const me = rows.find(r => r.is_me);
    $('#rankList').innerHTML = rows.length ? rows.map((r, i) => `
      <div class="rrow${r.is_me ? ' isme' : ''}${i === 0 ? ' top1' : ''}"><span class="n">${i + 1}</span>
        <div style="min-width:0"><b>${esc(r.is_me ? (S.nickname || 'Ty') : r.nickname)}${r.is_me ? ' · Ty' : ''}</b><small>${r.sightings} ${pl(r.sightings, ['obserwacja','obserwacje','obserwacji'])} · ${r.species} ${pl(r.species, ['gatunek','gatunki','gatunków'])}</small></div>
        <span class="x">${r.xp}</span></div>`).join('')
      + (me ? '' : `<p class="muted" style="font-size:13px">Nie ma Cię jeszcze w tym rankingu. Zgłoś obserwację w tej okolicy.</p>`)
      : '<p class="muted">Nikt jeszcze nie zdobył tu punktów w tym okresie. Możesz być pierwszy.</p>';
  }catch(e){ $('#rankList').innerHTML = `<p class="muted">Nie udało się wczytać rankingu: ${esc(e.message || e)}</p>`; }
}
function renderNickRow(){
  const row = $('#nickRow');
  row.innerHTML = `<span>Grasz jako <b>${esc(S.nickname || 'Anonimowy tropiciel')}</b></span><button class="btn ghost" style="height:36px;font-size:13px" id="nickEdit">${small(ICON.edit)} Zmień</button>`;
  $('#nickEdit').onclick = () => {
    row.innerHTML = `<form class="nickform" id="nickForm"><input class="input" id="nickIn" maxlength="24" value="${esc(S.nickname)}" placeholder="Pseudonim, 2–24 znaki" aria-label="Pseudonim"><button class="btn moss" style="height:46px">Zapisz</button></form>`;
    $('#nickIn').focus();
    $('#nickForm').onsubmit = async e => {
      e.preventDefault(); const v = $('#nickIn').value.trim();
      if(v.length < 2){ toast('Pseudonim musi mieć co najmniej 2 znaki'); return; }
      try{ await API.setNickname(v); S.nickname = v; toast('Zapisano pseudonim'); renderRank(); }
      catch(err){ toast('Nie udało się zapisać: ' + (err.message || err)); }
    };
  };
}

/* ---------- wyszukiwanie + lokalizacja ---------- */
let sT;
function initSearch(){
  const q = $('#q'), box = $('#results');
  q.addEventListener('input', () => {
    clearTimeout(sT); const v = q.value.trim();
    if(v.length < 3){ box.hidden = true; return; }
    sT = setTimeout(async () => {
      try{
        const b = map.getBounds();
        const vb = map.getZoom() >= 8 ? `&viewbox=${b.getWest()},${b.getNorth()},${b.getEast()},${b.getSouth()}` : '';
        const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=6&accept-language=pl${vb}&q=${encodeURIComponent(v)}`);
        const d = await r.json();
        box.innerHTML = d.length ? d.map(x => `<button data-ll="${x.lat},${x.lon}" data-bb="${(x.boundingbox || []).join(',')}">${esc(x.display_name.split(',').slice(0, 3).join(','))}</button>`).join('') : '<button disabled>Nic nie znaleziono</button>';
        box.hidden = false;
        $$('#results [data-ll]').forEach(btn => btn.onclick = () => {
          const bb = btn.dataset.bb.split(',').map(Number);
          if(bb.length === 4 && bb.every(isFinite)) map.fitBounds([[bb[0], bb[2]], [bb[1], bb[3]]], { maxZoom:16 });
          else { const [a, o] = btn.dataset.ll.split(',').map(Number); map.setView([a, o], 15); }
          box.hidden = true; q.blur();
        });
      }catch(e){ box.innerHTML = '<button disabled>Wyszukiwarka nie odpowiada. Spróbuj za chwilę.</button>'; box.hidden = false; }
    }, 500);
  });
  q.addEventListener('blur', () => setTimeout(() => box.hidden = true, 200));
}
function locate(silent){
  if(!navigator.geolocation){ if(!silent) toast('Ta przeglądarka nie udostępnia lokalizacji'); return; }
  navigator.geolocation.getCurrentPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude]; map.setView(ll, 14);
    if(!meDot) meDot = L.marker(ll, { icon:L.divIcon({ className:'', iconSize:[18,18], html:'<div class="medot"></div>' }), interactive:false, zIndexOffset:-100 }).addTo(map);
    else meDot.setLatLng(ll);
  }, err => {
    if(silent) return;
    if(location.protocol !== 'https:' && !/^(localhost|127\.)/.test(location.hostname)) toast('Lokalizacja działa tylko przez https:// albo localhost. Wyszukaj miasto ręcznie.');
    else toast('Brak dostępu do lokalizacji. Włącz ją w ustawieniach przeglądarki albo wyszukaj miasto.');
  }, { enableHighAccuracy:true, timeout:10000, maximumAge:60000 });
}
async function locateIfAllowed(){
  try{ const p = await navigator.permissions?.query({ name:'geolocation' }); if(p?.state === 'granted') locate(true); }catch(e){}
}

/* ---------- toast + komunikaty ---------- */
let toastT;
function toast(msg, kind){
  $$('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast' + (kind ? ' ' + kind : ''); t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), kind === 'xp' ? 1600 : 3600);
}
const noticeMsgs = [];
function notice(text, err){
  if(!noticeMsgs.includes(text)) noticeMsgs.push(text);
  $('#noticeText').textContent = noticeMsgs.join(' ');
  if(err) $('#notice').classList.add('err');
  $('#notice').hidden = false;
}

/* ---------- onboarding ---------- */
const TOPO = `<svg class="topo" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4">
  ${[0,1,2,3,4,5,6].map(i => `<ellipse cx="120" cy="120" rx="${30+i*26}" ry="${20+i*19}" transform="rotate(-18 120 120)"/>`).join('')}
  ${[0,1,2,3,4].map(i => `<ellipse cx="320" cy="230" rx="${22+i*24}" ry="${16+i*17}" transform="rotate(24 320 230)"/>`).join('')}</svg>`;
const SLIDES = [
  { art:`${TOPO}<div class="p" style="left:16%;top:22%">🐗</div><div class="p" style="left:58%;top:16%">🦊</div><div class="p" style="left:36%;top:56%">🦌</div><div class="p" style="left:72%;top:52%">🦡</div>`,
    eyebrow:CONFIG.APP_NAME, title:'Miasto dzielimy z dzikimi zwierzętami',
    text:'Dziki, lisy i sarny korzystają z tych samych parków i ulic co my — w każdym mieście. Zaznaczaj, gdzie je widzisz, a razem stworzymy mapę dzikich korytarzy.' },
  { art:`${TOPO}<div class="p" style="left:44%;top:30%;width:64px;height:64px;background:var(--fox);color:var(--fox-ink)">${ICON.plus}</div>`,
    eyebrow:'Zgłoszenie w 20 sekund', title:'Zobaczyłeś zwierzę? Postaw pinezkę',
    text:'Stuknij pomarańczowy przycisk, ustaw pinezkę i wybierz gatunek. Zdjęcie jest mile widziane, ale nieobowiązkowe. Inni mogą potwierdzić Twoją obserwację.' },
  { art:`${TOPO}<div class="big">+35 XP</div><div class="p" style="right:12%;left:auto;top:20%;border-radius:0;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);background:var(--fox);color:var(--fox-ink)">${ICON.star}</div>`,
    eyebrow:'Gra w tropiciela', title:'Zbieraj XP, odznaki i kwadraty mapy',
    text:'Awansuj od Świeżaka do Legendy. Uzupełniaj atlas gatunków, odkrywaj kolejne kwadraty 1 km, utrzymuj serię dni i rywalizuj z okolicą albo z całym światem.' },
  { last:true, eyebrow:'Ostatni krok', title:'Jak mamy Cię nazywać?',
    text:'Pseudonim zobaczą inni w rankingu. Możesz go zmienić później. Za chwilę zapytamy o lokalizację, żeby pokazać mapę wokół Ciebie.' },
];
let onbStep = 0;
function openOnboarding(){ onbStep = 0; $('#onb').hidden = false; renderOnb(); }
function renderOnb(){
  const s = SLIDES[onbStep];
  $('#onbIn').innerHTML = `
    ${s.art ? `<div class="onb-art">${s.art}</div>` : ''}
    <div class="dots" aria-label="Krok ${onbStep + 1} z ${SLIDES.length}">${SLIDES.map((_, i) => `<i class="${i === onbStep ? 'on' : ''}"></i>`).join('')}</div>
    <div style="display:flex;flex-direction:column;gap:10px"><div class="eyebrow">${esc(s.eyebrow)}</div><h1>${esc(s.title)}</h1><p>${esc(s.text)}</p></div>
    ${s.last ? `
      <div class="field"><label for="onbNick">Pseudonim</label><input class="input" id="onbNick" maxlength="24" placeholder="np. LisiTrop" value="${esc(S.nickname)}"></div>
      <label class="consent"><input type="checkbox" id="onbOk"><span>Zgadzam się na zapisywanie lokalizacji i czasu moich zgłoszeń, ich publikację na mapie pod pseudonimem oraz udostępnianie zanonimizowanych danych miastom i naukowcom (RODO/GDPR). Zgodę możesz wycofać, pisząc do administratora projektu.</span></label>
      <p style="font-size:13px">W sytuacji zagrożenia dzwoń na ${esc(EMERGENCY)}.</p>` : ''}
    <div class="btns" style="margin-top:auto">
      ${onbStep ? '<button class="btn ghost" id="onbBack">Wstecz</button>' : ''}
      <button class="btn ${s.last ? 'primary' : 'moss'}" id="onbNext"${s.last ? ' disabled' : ''}>${s.last ? 'Pokaż mapę wokół mnie' : 'Dalej'}</button></div>`;
  $('#onbBack') && ($('#onbBack').onclick = () => { onbStep--; renderOnb(); });
  if(s.last){
    $('#onbOk').onchange = e => { $('#onbNext').disabled = !e.target.checked; };
    $('#onbNext').onclick = async () => {
      const n = $('#onbNick').value.trim();
      if(n && n.length < 2){ toast('Pseudonim musi mieć co najmniej 2 znaki'); return; }
      if(n && n !== S.nickname){ try{ await API.setNickname(n); S.nickname = n; }catch(e){ toast('Pseudonim nie został zapisany: ' + (e.message || e)); } }
      LS.set('dk_onb_v4', true); $('#onb').hidden = true; renderHud();
      locate(false);
    };
  } else $('#onbNext').onclick = () => { onbStep++; renderOnb(); };
}

/* =====================================================================
   START
   ===================================================================== */
async function loadMine(){ const m = await API.mine(); S.mine = m.list; S.myConf = m.conf; }
async function reload(){ await Promise.all([loadMine(), loadArea()]); }

function bindStatic(){
  document.title = CONFIG.APP_NAME;
  $('#icoSearch').innerHTML = ICON.search;
  $('#locate').innerHTML = ICON.locate;
  $('#noticeClose').innerHTML = ICON.close;
  $('#addBtn span').innerHTML = ICON.plus;
  const tabIcons = { map:'map', quests:'flag', atlas:'book', rank:'trophy' };
  $$('.tab').forEach(b => { b.querySelector('.ic').innerHTML = ICON[tabIcons[b.dataset.tab]]; b.onclick = () => setTab(b.dataset.tab === S.tab && b.dataset.tab !== 'map' ? 'map' : b.dataset.tab); });
  $$('[data-close]').forEach(b => { b.innerHTML = ICON.close; b.onclick = closeSheets; });
  $$('[data-tabclose]').forEach(b => { b.innerHTML = ICON.close; b.onclick = () => setTab('map'); });
  $('#scrim').onclick = closeSheets;
  $('#noticeClose').onclick = () => { $('#notice').hidden = true; };
  $('#meChip').onclick = () => setTab('atlas');
  $('#locate').onclick = () => locate(false);
  $('#addBtn').onclick = () => startAdd();
  $('#addCancel').onclick = stopAdd;
  $('#addOk').onclick = () => { const c = map.getCenter(); S.pick = { lat:c.lat, lng:wrap(c.lng) }; stopAdd(); openForm(); };
  $$('.seg button[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  $('#modal').onclick = e => { if(e.target.id === 'modal') $('#modal').hidden = true; };
  document.addEventListener('keydown', e => { if(e.key !== 'Escape') return; if(!$('#modal').hidden) $('#modal').hidden = true; else if(S.adding) stopAdd(); else if($('.sheet.open:not(.panel)')) closeSheets(); else setTab('map'); });
  initSearch();
}

async function boot(){
  bindStatic();
  if(!window.L){ notice('Nie udało się wczytać biblioteki mapy. Sprawdź połączenie z internetem i odśwież stronę.', true); return; }
  initMap();
  const start = async () => {
    API = DEMO ? demoApi() : supaApi();
    await API.init();
    const sp = await API.species();
    S.species = sp.sort((a, b) => (SP_ORDER.indexOf(a.name_pl) + 1 || 99) - (SP_ORDER.indexOf(b.name_pl) + 1 || 99));
    S.spById = {}; S.species.forEach(s => S.spById[s.id] = s);
    await reload();
    S.nickname = await API.getNickname();
  };
  try{
    await start();
    if(DEMO) notice('Tryb demo: przykładowe obserwacje pojawiają się wokół miejsca, które oglądasz. Zapis tylko w tej przeglądarce.');
  }catch(e){
    console.error(e);
    if(!DEMO){
      // Baza niedostępna albo bez migracji v4 — pokazujemy tryb demo zamiast pustej mapy
      DEMO = true;
      notice('Baza nie odpowiada albo brakuje w niej migracji supabase_v4.sql (' + (e.message || e) + '). Na razie działa tryb demo — zapis tylko w tej przeglądarce.', true);
      try{ await start(); }catch(e2){ console.error(e2); }
    } else notice('Nie udało się uruchomić aplikacji: ' + (e.message || e), true);
  }
  renderChips(); renderAll();
  if(!LS.get('dk_onb_v4', false)) openOnboarding(); else locateIfAllowed();
  if('serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.)/.test(location.hostname)))
    navigator.serviceWorker.register('sw.js').catch(() => {});
}
boot();
</script>
