<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2D5843">
<meta name="description" content="Mapa dzikich zwierząt w mieście. Zgłaszaj obserwacje, zbieraj XP i odznaki.">
<script>
/* Manifest w języku użytkownika (opis aplikacji); nazwa zawsze „Tropami” */
(function(){
  var pl = false;
  try{ var s = JSON.parse(localStorage.getItem('dk_lang') || '"auto"'); pl = s === 'pl' || (s !== 'en' && (navigator.languages || [navigator.language]).some(function(l){ return /^pl\b/i.test(l); })); }catch(e){}
  var l = document.createElement('link'); l.rel = 'manifest'; l.href = pl ? 'manifest-pl.webmanifest' : 'manifest-en.webmanifest'; document.head.appendChild(l);
})();
</script>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tropami">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Tropami</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400..900&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
/* Layout: pełnoekranowa mapa, HUD u góry, pasek zakładek z przyciskiem „Zgłoś”, panele jako arkusze od dołu */
:root{
  --bg:#E9EEE6; --surface:#FFFFFF; --surface-2:#F2F5EF; --ink:#14221A; --ink-2:#55665B; --line:#D6DDD1;
  --moss:#2D5843; --moss-ink:#FFFFFF; --moss-soft:#DCE8DF;
  --fox:#E2832B; --fox-ink:#211204; --fox-soft:#FBE7D3;
  --danger:#BE3F2C; --danger-soft:#F8DED8; --ok:#3B8A5A;
  --scrim:rgba(10,20,14,.38); --shadow:0 10px 30px rgba(20,34,26,.16);
  --f-display:'Nunito',ui-rounded,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Nunito',ui-rounded,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'Nunito',ui-rounded,ui-sans-serif,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1611; --surface:#17211B; --surface-2:#1E2A23; --ink:#E6EEE8; --ink-2:#9EAEA4; --line:#2B3930;
    --moss:#82C7A0; --moss-ink:#0C1810; --moss-soft:#1F3328;
    --fox:#F29C4B; --fox-ink:#1E1004; --fox-soft:#3A2614;
    --danger:#EC7A64; --danger-soft:#3A1E19; --ok:#7CC39A;
    --scrim:rgba(0,0,0,.55); --shadow:0 10px 30px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1611; --surface:#17211B; --surface-2:#1E2A23; --ink:#E6EEE8; --ink-2:#9EAEA4; --line:#2B3930;
  --moss:#82C7A0; --moss-ink:#0C1810; --moss-soft:#1F3328;
  --fox:#F29C4B; --fox-ink:#1E1004; --fox-soft:#3A2614;
  --danger:#EC7A64; --danger-soft:#3A1E19; --ok:#7CC39A;
  --scrim:rgba(0,0,0,.55); --shadow:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--fox);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}

/* ---------- MAP ---------- */
#map{position:fixed;inset:0;background:var(--bg);z-index:1}
.leaflet-container{font-family:var(--f-body);background:var(--bg)}
/* OSM nie ma ciemnego stylu — w trybie ciemnym przyciemniamy kafelki filtrem */
body.tiles-invert .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.85) saturate(.6)}
.leaflet-tile-pane{filter:saturate(.8)}
.leaflet-bottom{bottom:calc(74px + env(safe-area-inset-bottom,0px))}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 80%,transparent)!important;color:var(--ink-2)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--ink-2)!important}

.pin{position:relative;width:40px;height:40px;border-radius:50%;background:var(--surface);border:3px solid var(--ok);display:grid;place-items:center;font-size:20px;line-height:1;box-shadow:0 4px 10px rgba(0,0,0,.28);transition:transform .15s}
.pin:hover{transform:scale(1.08)}
.pin.d1{border-color:var(--ink-2)} .pin.d2{border-color:var(--fox)} .pin.d3{border-color:var(--danger)}
.pin.mine::after{content:"";position:absolute;right:-3px;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--moss);border:2px solid var(--surface)}
.pin.fresh::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--fox);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{opacity:.9;transform:scale(.8)}to{opacity:0;transform:scale(1.35)}}
.medot{width:18px;height:18px;border-radius:50%;background:var(--fox);border:3px solid #fff;box-shadow:0 0 0 6px color-mix(in srgb,var(--fox) 30%,transparent)}

/* ---------- TOP HUD ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:600;display:flex;flex-direction:column;gap:8px;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.top>*{pointer-events:auto}
.row{display:flex;gap:8px;align-items:center}
.search{position:relative;flex:1;min-width:0}
.search label{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow)}
.search svg{flex:none;color:var(--ink-2)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15px}
.results{position:absolute;left:0;right:0;top:54px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px}
.results button:last-child{border-bottom:0}
.results button:hover{background:var(--surface-2)}
.me{flex:none;display:flex;align-items:center;gap:8px;height:48px;padding:0 12px 0 7px;border:0;border-radius:16px;background:var(--moss);color:var(--moss-ink);box-shadow:var(--shadow)}
.me .lv{position:relative;width:36px;height:36px}
.me .lv b{position:absolute;inset:0;display:grid;place-items:center;font:700 13px var(--f-mono)}
.me .txt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.me .txt span:first-child{font-weight:700;font-size:13px}
.me .txt span:last-child{font:500 11px var(--f-mono);opacity:.85}
.me .streak{display:flex;align-items:center;gap:1px;font:700 12px var(--f-mono);color:var(--fox);margin-left:2px}
.me .streak svg{width:16px;height:16px}
.seg{display:inline-flex;background:var(--surface);border-radius:13px;padding:3px;box-shadow:var(--shadow);gap:2px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:10px;font-weight:600;font-size:13px;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-12px;padding:2px 12px 6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.08);white-space:nowrap}
.chip.on{background:var(--moss);border-color:var(--moss);color:var(--moss-ink)}
.chip select{border:0;background:transparent;font-weight:600;font-size:13px;outline:none;cursor:pointer}
.notice{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;max-width:100%;background:var(--fox-soft);color:var(--ink);border-radius:12px;padding:7px 8px 7px 12px;font-size:12.5px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.notice.err{background:var(--danger-soft)}
.notice button{border:0;background:none;padding:2px;display:grid;color:var(--ink-2)}
.notice button svg{width:16px;height:16px}

.float{position:fixed;z-index:600;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:15px;border:0;background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow)}
.empty-note{position:fixed;z-index:590;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom,0px));background:var(--surface);border-radius:999px;padding:8px 14px;font-size:13px;box-shadow:var(--shadow);white-space:nowrap}

/* ---------- TAB BAR ---------- */
.tabbar{position:fixed;z-index:700;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:end;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:5px 0;font-size:11px;font-weight:700;color:var(--ink-2)}
.tab.on{color:var(--moss)}
.tab .dot{position:absolute;top:2px;left:calc(50% + 8px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--fox);color:var(--fox-ink);font:700 10px/16px var(--f-mono)}
.fab{justify-self:center;margin-top:-30px;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;font-size:11px;font-weight:800;color:var(--ink)}
.fab span:first-child{width:62px;height:62px;border-radius:21px;background:var(--fox);color:var(--fox-ink);display:grid;place-items:center;box-shadow:0 10px 22px color-mix(in srgb,var(--fox) 45%,transparent);transition:transform .15s}
.fab:active span:first-child{transform:scale(.94)}
.fab svg{width:30px;height:30px;stroke-width:2.6}

/* ---------- ADD MODE ---------- */
.cross{position:fixed;z-index:610;left:50%;top:50%;transform:translate(-50%,-100%);pointer-events:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.cross::after{content:"";position:absolute;left:50%;bottom:-4px;width:10px;height:5px;margin-left:-5px;border-radius:50%;background:rgba(0,0,0,.35)}
.addbar{position:fixed;z-index:700;left:0;right:0;bottom:0;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);padding-top:16px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;max-width:560px;margin-inline:auto}
.addbar .hint{font-size:14px}
.addbar .zone{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--moss)}
.addbar .zone.new{color:var(--fox)}
body:not(.adding) .cross, body:not(.adding) .addbar{display:none}
body.adding .tabbar, body.adding .float, body.adding .top .row2, body.adding .top .chips, body.adding .empty-note{display:none}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:15px;border:0;font-weight:700;font-size:15px;background:var(--surface-2);color:var(--ink)}
.btn.primary{background:var(--fox);color:var(--fox-ink)}
.btn.moss{background:var(--moss);color:var(--moss-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.btn.block{width:100%}
.btns{display:flex;gap:10px}
.btns .btn{flex:1}
.iconbtn{width:38px;height:38px;border-radius:12px;border:0;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}
.iconbtn svg{width:20px;height:20px}

/* ---------- SHEETS ---------- */
.scrim{position:fixed;inset:0;z-index:790;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:800;left:0;right:0;bottom:0;max-width:560px;margin-inline:auto;max-height:88%;display:flex;flex-direction:column;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:0 -14px 40px rgba(0,0,0,.22);transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.85,.25,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet.panel{z-index:650;max-height:calc(100% - 70px - env(safe-area-inset-top,0px))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 18px 10px}
.sheet-head::before{content:"";position:absolute;left:50%;top:7px;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line)}
.sheet-head h2{font-size:22px;padding-top:12px}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:20px;padding-top:2px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.sheet.panel .sheet-body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-h h3{font-size:17px}
.sec-h .mono{font-size:12px;color:var(--ink-2)}

/* sighting card */
.sc-head{display:flex;gap:14px;align-items:center}
.sc-ico{flex:none;width:58px;height:58px;border-radius:18px;background:var(--surface-2);display:grid;place-items:center;font-size:32px;border:3px solid var(--ok)}
.sc-ico.d1{border-color:var(--ink-2)} .sc-ico.d2{border-color:var(--fox)} .sc-ico.d3{border-color:var(--danger)}
.sc-head h2{font-size:24px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2)}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta svg{width:15px;height:15px}
.photo{width:100%;max-width:100%;aspect-ratio:4/3;border-radius:16px;background:var(--surface-2);object-fit:cover;display:grid;place-items:center;color:var(--ink-2);font-size:13px}
.tip{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface-2);font-size:13.5px}
.tip.warn{background:var(--danger-soft)}
.tip svg{flex:none;width:20px;height:20px;color:var(--danger)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;font-weight:600}

/* form */
.spgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.spbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px 10px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:13px}
.spbtn .e{font-size:30px;line-height:1}
.spbtn.on{border-color:var(--moss);background:var(--moss-soft)}
.spbtn .new{position:absolute;top:-8px;right:-4px;background:var(--fox);color:var(--fox-ink);font:700 9.5px/1 var(--f-mono);padding:4px 6px;border-radius:7px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-weight:700;font-size:14px}
.input{height:46px;border-radius:13px;border:1px solid var(--line);background:var(--surface-2);padding:0 13px;outline:none;width:100%}
.input:focus{border-color:var(--moss)}
.bchips{display:flex;flex-wrap:wrap;gap:6px}
.bchips .chip{box-shadow:none}
.photo-pick{display:flex;gap:12px;align-items:center}
.photo-pick img{width:72px;height:72px;border-radius:14px;object-fit:cover}
.photo-pick label{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 16px;border-radius:13px;border:1px dashed var(--ink-2);font-weight:600;cursor:pointer}
.photo-pick input{position:absolute;width:1px;height:1px;opacity:0}
.xprev{display:flex;flex-wrap:wrap;gap:6px}
.xprev span{font:700 12px var(--f-mono);padding:5px 9px;border-radius:9px;background:var(--fox-soft);color:var(--ink)}

/* level + progress */
.levelcard{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:20px;background:var(--moss);color:var(--moss-ink)}
.levelcard .top-l{display:flex;align-items:center;gap:14px}
.levelcard h3{font-size:26px}
.levelcard .xp{font:700 14px var(--f-mono);opacity:.9}
.bar{height:10px;border-radius:5px;background:color-mix(in srgb,currentColor 18%,transparent);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--fox);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:10.5px;font-weight:700}
.ladder div{display:flex;flex-direction:column;gap:3px;opacity:.55}
.ladder div.on{opacity:1}
.ladder i{height:4px;border-radius:2px;background:currentColor}
.ladder span:last-child{font-family:var(--f-mono);font-weight:500}

/* atlas */
.atlas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.atl{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 6px 12px;border-radius:16px;background:var(--surface-2);text-align:center}
.atl .e{font-size:34px;line-height:1.1}
.atl b{font-size:13.5px}
.atl .mono{font-size:11px;color:var(--ink-2)}
.atl.locked .e{filter:grayscale(1) brightness(.2);opacity:.35}
:root[data-theme="dark"] .atl.locked .e{filter:grayscale(1) brightness(2.2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .atl.locked .e{filter:grayscale(1) brightness(2.2)}}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.medal{width:62px;height:62px;display:grid;place-items:center;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);background:var(--fox);color:var(--fox-ink)}
.medal svg{width:28px;height:28px}
.badge b{font-size:12.5px;line-height:1.2}
.badge small{font-size:11px;color:var(--ink-2);line-height:1.25}
.badge.locked .medal{background:var(--surface-2);color:var(--ink-2);outline:0}
.badge.locked b{color:var(--ink-2)}
.rules{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14px}
.rules span:nth-child(even){font:700 13px var(--f-mono);color:var(--moss);text-align:right}

/* quests */
.streakcard{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:20px;background:var(--fox-soft)}
.streakcard .big{display:flex;align-items:center;gap:12px}
.streakcard .big b{font:700 44px/1 var(--f-mono);color:var(--fox)}
.streakcard .big svg{width:40px;height:40px;color:var(--fox)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:11px;font-weight:700;color:var(--ink-2)}
.days i{display:block;height:30px;border-radius:9px;border:2px dashed color-mix(in srgb,var(--ink-2) 50%,transparent);margin-bottom:4px}
.days .on i{background:var(--fox);border:2px solid var(--fox)}
.days .today i{border-color:var(--ink)}
.quest{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--surface-2)}
.quest .qi{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--surface);color:var(--moss)}
.quest b{display:block;font-size:14.5px;margin-bottom:7px}
.quest .bar{height:7px;color:var(--ink)}
.quest .bar i{background:var(--moss)}
.quest .mono{font-size:13px;font-weight:700}
.quest.done{background:var(--moss-soft)}
.quest.done .qi{background:var(--moss);color:var(--moss-ink)}

/* ranking */
.rank-list{display:flex;flex-direction:column}
.rrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line)}

.nickform{display:flex;gap:8px;width:100%}

.modal{position:fixed;inset:0;z-index:900;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));background:var(--scrim)}
.mcard{width:100%;max-width:400px;max-height:90vh;overflow-y:auto;background:var(--surface);border-radius:26px;padding:24px 22px 20px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow);animation:pop .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.gain{text-align:center}
.gain b{display:block;font:800 64px/1 var(--f-display);color:var(--fox);letter-spacing:-.03em}
.gain span{font-weight:700;color:var(--ink-2)}
.lines{display:flex;flex-direction:column;gap:6px}
.lines div{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:8px 12px;border-radius:11px;background:var(--surface-2)}
.lines div span:last-child{font:700 13px var(--f-mono);color:var(--moss);white-space:nowrap}
.lvup{text-align:center;padding:14px;border-radius:16px;background:var(--moss);color:var(--moss-ink)}
.lvup b{display:block;font:800 26px var(--f-display)}
.mprog{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-2)}

.newbadges{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.newbadges .badge{width:96px}
.newbadges .medal{animation:spin .9s cubic-bezier(.2,.9,.3,1.2)}
@keyframes spin{from{transform:rotateY(180deg) scale(.6)}to{transform:none}}

/* toast */
.toast{position:fixed;z-index:950;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:var(--shadow);animation:tin .3s ease-out}
.toast.xp{background:var(--fox);color:var(--fox-ink);font:800 20px var(--f-mono)}
@keyframes tin{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}

.onb{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;flex-direction:column;padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));overflow-y:auto}
.onb-in{width:100%;max-width:440px;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:20px}

.onb h1{font-size:clamp(28px,7.5vw,38px);line-height:1.05;font-weight:800}

.consent{display:flex;gap:12px;align-items:flex-start;font-size:13px;color:var(--ink-2);padding:12px 14px;border-radius:14px;background:var(--surface)}
.consent input{width:22px;height:22px;flex:none;accent-color:var(--moss);margin:0}

.stylelist{display:flex;flex-wrap:wrap;gap:6px}

const INAT = 'https://api.inaturalist.org/v1';

const iCache = new Map();
const cached = (k, fn) => { if(!iCache.has(k)) iCache.set(k, fn().catch(e => { iCache.delete(k); throw e; })); return iCache.get(k); };
// Ptaki = Aves; „inne” = ssaki, gady i płazy (bez ryb, ślimaków, owadów)
const GROUPS = { bird:'3', other:'40151,26036,20978' };
function inatSearch(q, birds, near){
  const where = near ? `${near.lat.toFixed(1)},${near.lng.toFixed(1)}` : '';
  return cached(`s:${birds ? 1 : 0}:${LANG}:${where}:${q.toLowerCase()}`, async () => {
    const r = await fetch(`${INAT}/taxa/autocomplete?q=${encodeURIComponent(q)}&locale=${LANG}&per_page=15&is_active=true&taxon_id=${birds ? GROUPS.bird : GROUPS.other}`);
    if(!r.ok) throw new Error('iNaturalist ' + r.status);
    let list = (await r.json()).results.filter(x => x.rank_level <= 20);
    // najpierw gatunki widywane w promieniu 150 km od pinezki
    if(near && list.length){
      try{
        const c = await fetch(`${INAT}/observations/species_counts?taxon_id=${list.map(x => x.id).join(',')}&lat=${near.lat}&lng=${near.lng}&radius=150&verifiable=true&per_page=50`);
        if(c.ok){ const m = new Map((await c.json()).results.map(x => [x.taxon.id, x.count]));
          list.forEach((x, i) => { x._near = m.get(x.id) || 0; x._i = i; });
          list.sort((a, b) => (b._near > 0) - (a._near > 0) || b._near - a._near || a._i - b._i); }
      }catch(e){}
    }
    return list.slice(0, 6);
  });
}
function inatDetail(id){
  return cached(`d:${LANG}:${id}`, async () => {
    const r = await fetch(`${INAT}/taxa/${id}?locale=${LANG}`);
    if(!r.ok) throw new Error('iNaturalist ' + r.status);
    return (await r.json()).results[0];
  });
}
async function inatByLatin(latin){
  const list = await cached(`l:${LANG}:${latin}`, async () => {
    const r = await fetch(`${INAT}/taxa/autocomplete?q=${encodeURIComponent(latin)}&locale=${LANG}&per_page=5`);
    if(!r.ok) throw new Error('iNaturalist ' + r.status);
    return (await r.json()).results;
  });
  const hit = list.find(x => x.name === latin) || list[0];
  return hit ? inatDetail(hit.id) : null;
}
// Z artykułu w Wikipedii bierzemy wstęp i krótkie fragmenty: wygląd, gdzie żyje, co je, tryb życia
const WIKI_SECTIONS = {
  look:  /^(wygląd|morfologia|charakterystyka|opis|budowa|upierzenie|description|appearance|characteristics|identification|build|morphology|physical|plumage)/i,
  where: /^(występowanie|zasięg|środowisko|siedlisko|rozmieszczenie|distribution|habitat|range)/i,
  food:  /^(pożywienie|pokarm|odżywianie|dieta|diet|feeding|food)/i,
  life:  /^(tryb życia|biologia|ekologia|zachowanie|behaviou?r|ecology|biology|life)/i,
};
const sentences = (txt, max) => { const out = []; let len = 0;
  for(const s of txt.replace(/\s+/g, ' ').split(/(?<=[.!?])\s+(?=[A-ZĄĆĘŁŃÓŚŹŻ0-9„(])/)){ if(len && len + s.length > max) break; out.push(s); len += s.length; if(len > max * .6) break; }
  return out.join(' '); };
function wikiFacts(url){
  const m = url && url.match(/^https?:\/\/([a-z-]+)\.wikipedia\.org\/wiki\/(.+)$/);
  if(!m) return Promise.resolve(null);
  return cached('w:' + url, async () => {
    const title = decodeURIComponent(m[2]).replace(/_/g, ' ');
    const r = await fetch(`https://${m[1]}.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&exsectionformat=wiki&redirects=1&format=json&origin=*&titles=${encodeURIComponent(title)}`);
    if(!r.ok) return null;
    const page = Object.values((await r.json()).query?.pages || {})[0];
    const raw = page?.extract || ''; if(!raw) return null;
    const parts = raw.split(/\n={2,}\s*(.+?)\s*={2,}\n/);   // [wstęp, nagłówek, treść, nagłówek, treść…]
    const facts = {};
    for(let i = 1; i < parts.length; i += 2){
      const head = parts[i].trim(), body = (parts[i + 1] || '').trim();
      for(const [k, re] of Object.entries(WIKI_SECTIONS)) if(!facts[k] && re.test(head) && body.length > 40) facts[k] = sentences(body, 230);
    }
    return { intro:sentences(parts[0] || '', 260), facts };
  }).catch(() => null);
}
// Tylko zdjęcia na wolnej licencji (Creative Commons), z podpisem autora
function freePhoto(tx){
  const cand = [tx?.default_photo, ...((tx?.taxon_photos) || []).map(p => p.photo)].filter(Boolean);
  const p = cand.find(p => p.license_code);
  return p ? { sq:p.square_url, md:p.medium_url || p.url, attr:p.attribution } : null;
}
const stripTags = s => String(s || '').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
const cut = (s, n) => s.length > n ? s.slice(0, s.lastIndexOf(' ', n) > n * .6 ? s.lastIndexOf(' ', n) : n) + '…' : s;
async function renderEdu(box, tx, eyebrow){
  if(!box || !tx) return;
  const wiki = tx.wikipedia_url ? await wikiFacts(tx.wikipedia_url) : null;
  let intro = stripTags(tx.wikipedia_summary);
  if(wiki?.intro && wiki.intro.length > intro.length) intro = wiki.intro;
  const facts = Object.entries(wiki?.facts || {}).slice(0, 3);
  if(!box.isConnected) return;
  const ph = freePhoto(tx), name = tx.preferred_common_name || tx.name;
  box.className = 'edu';
  box.innerHTML = `${ph ? `<img src="${esc(ph.md)}" alt="${esc(name)}" loading="lazy">` : ''}
    <div class="eb"><div class="eyebrow">${esc(eyebrow || t('did_you_know'))}</div>
      <div class="eh"><b>${esc(name.charAt(0).toUpperCase() + name.slice(1))}</b><i>${esc(tx.name)}</i></div>
      ${intro ? `<p>${esc(cut(intro, 300))}</p>` : ''}
      ${facts.length ? `<dl class="facts">${facts.map(([k, v]) => `<dt>${esc(t('fact_' + k))}</dt><dd>${esc(cut(v, 260))}</dd>`).join('')}</dl>` : ''}
      <div class="src">${ph ? `${esc(t('photo_by'))}: ${esc(ph.attr)} · ` : ''}${tx.wikipedia_url ? `<a href="${esc(tx.wikipedia_url)}" target="_blank" rel="noopener">${esc(t('more_wiki'))}</a> · ` : ''}<a href="https://www.inaturalist.org/taxa/${tx.id}" target="_blank" rel="noopener">iNaturalist</a></div></div>`;
}

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function rng(seed){ let h = 2166136261; for(const c of seed){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h += 0x6D2B79F5; let x = h; x = Math.imul(x ^ x >>> 15, x | 1); x ^= x + Math.imul(x ^ x >>> 7, x | 61); return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
function dist(a, b, c, d){ const R = 6371000, r = Math.PI/180; const dl = ((d - b + 540) % 360) - 180; const x = dl*r*Math.cos((a+c)/2*r), y = (c-a)*r; return Math.sqrt(x*x + y*y) * R; }
function cellOf(lat, lng){
  const r = Math.floor(lat / CELL), latc = (r + .5) * CELL;
  const w = CELL / Math.max(.15, Math.cos(latc * Math.PI / 180));
  const c = Math.floor(lng / w);
  return { id:r + ':' + c, lat:latc, lng:(c + .5) * w, bounds:[[r*CELL, c*w], [(r+1)*CELL, (c+1)*w]] };
}
function dayKey(d){ d = new Date(d); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function weekStart(d = new Date()){ const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay()+6) % 7)); return x; }
function weekKey(){ return dayKey(weekStart()); }
function toLocalInput(d){ const p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function ago(iso){
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if(m < 1) return t('ago_now');
  if(m < 60) return m + ' ' + t('ago_min');
  const h = Math.round(m / 60); if(h < 24) return h + ' ' + t('ago_h');
  const d = Math.round(h / 24); if(d === 1) return t('ago_y'); if(d < 7) return d + ' ' + t('ago_d');
  return new Date(iso).toLocaleDateString(LOCALE(), { day:'numeric', month:'short' });
}

function supaApi(){
  const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  let uid = null;
  const ok = ({ data, error }) => { if(error) throw error; return data; };
  const num = r => ({ ...r, lat:+r.lat, lng:+r.lng });
  // Najnowsza dostępna wersja funkcji w bazie (v7 → v6 → v4); zapamiętujemy, która działa
  const fnUse = {};
  const missing = e => /PGRST202|Could not find the function/i.test((e?.code || '') + ' ' + (e?.message || ''));
  async function rpcBest(op, names, argsFor){
    let last;
    for(const n of (fnUse[op] ? [fnUse[op]] : names)){
      const r = await sb.rpc(n, argsFor(n));
      if(!r.error){ fnUse[op] = n; return r.data; }
      last = r.error; if(!missing(r.error)) throw r.error;
    }
    throw last;
  }
  return {
    async init(){
      let session = ok(await sb.auth.getSession()).session;
      if(!session) session = ok(await sb.auth.signInAnonymously()).session;
      uid = session.user.id; return uid;
    },
    async species(){ return ok(await sb.from('species').select('id,name_pl,icon,danger_level')); },
    async area(b){
      const args = { p_w:b.w, p_s:b.s, p_e:b.e, p_n:b.n, p_limit:3000 };
      return (await rpcBest('area', ['dk_sightings_in_bbox_v3', 'dk_sightings_in_bbox_v2', 'dk_sightings_in_bbox'], () => args)).map(num);
    },
    async mine(){
      const list = await rpcBest('mine', ['dk_my_sightings_v3', 'dk_my_sightings_v2', 'dk_my_sightings'], () => ({}));
      const conf = ok(await sb.rpc('dk_my_confirmations'));
      return { list:list.map(num), conf:conf.map(r => new Date(r.created_at).getTime()) };
    },
    async photo(id){ return ok(await sb.from('sightings').select('photo_url').eq('id', id).single()).photo_url; },
    async add(o){
      let photo = o.photo_url;
      if(photo && photo.startsWith('data:')){
        // Zdjęcie idzie do Supabase Storage, w bazie zostaje tylko link.
        // Jeśli magazynu jeszcze nie ma (brak migracji v5), zapisujemy jak dawniej.
        try{
          const blob = await (await fetch(photo)).blob();
          const path = `${uid}/${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}.jpg`;
          ok(await sb.storage.from('photos').upload(path, blob, { contentType:'image/jpeg', upsert:false }));
          photo = sb.storage.from('photos').getPublicUrl(path).data.publicUrl;
        }catch(e){ console.warn('Storage unavailable, photo saved in DB:', e.message || e); }
      }
      const base = { p_species:o.species_id, p_lat:o.lat, p_lng:o.lng, p_photo:photo, p_seen_at:o.seen_at };
      return rpcBest('add', ['dk_add_sighting_v3', 'dk_add_sighting_v2', 'dk_add_sighting'], n =>
        n.endsWith('_v3') ? { ...base, p_behavior:o.behavior, p_taxon:o.taxon || null, p_taxon_sci:o.taxon_sci || null, p_taxon_inat:o.taxon_inat || null }
        : n.endsWith('_v2') ? { ...base, p_behavior:o.behavior, p_taxon:o.taxon || null }
        // bez migracji v6/v7: nazwę gatunku zapisujemy na początku opisu
        : { ...base, p_behavior:[o.taxon, o.behavior].filter(Boolean).join(' — ') || null });
    },
    async confirm(id){ ok(await sb.rpc('dk_confirm', { p_sighting:id })); },
    async leaderboard(since, near){ return ok(await sb.rpc('dk_leaderboard', { p_since:since, p_lat:near?.lat ?? null, p_lng:near?.lng ?? null, p_radius_m:near ? near.r : null })); },
    async getNickname(){ const { data } = await sb.from('profiles').select('nickname').eq('id', uid).maybeSingle(); return data?.nickname || ''; },
    async setNickname(n){ ok(await sb.rpc('dk_set_nickname', { p_nickname:n })); },
  };
}

  const inBox = (s, b) => s.lat >= b.s && s.lat <= b.n && (b.w <= b.e ? s.lng >= b.w && s.lng <= b.e : s.lng >= b.w || s.lng <= b.e);

    async init(){ return 'me'; },
    async species(){ return SPECIES; },
    async area(b){
      const c = [(b.s + b.n) / 2, (b.w + b.e) / 2];
      if(b.z >= 12 && !db.clusters.some(x => dist(x[0], x[1], c[0], c[1]) < 6000)) seedAround(c[0], c[1]);
      return db.s.filter(s => inBox(s, b)).map(view).sort((a, b) => b.seen_at.localeCompare(a.seen_at));
    },
    async mine(){ return { list:db.s.filter(s => s.author === 'me').map(view), conf:db.conf.slice() }; },
    async photo(id){ return db.s.find(x => x.id === id)?.photo_url || null; },
    async add(o){
      const id = 'm' + Date.now().toString(36);
      db.s.push({ id, ...o, author:'me', cc:0 });
      if(!save()){ db.s[db.s.length - 1].photo_url = null; save(); toast(t('no_space')); }
      return id;
    },
    async confirm(id){ const s = db.s.find(x => x.id === id); if(s && !s.byMe && s.author !== 'me'){ s.byMe = true; s.cc++; db.conf.push(Date.now()); save(); } },
    async leaderboard(since, near){
      const tt = since ? new Date(since).getTime() : 0, by = {};
      const U = a => by[a] ||= { n:0, ph:0, sp:new Set(), cg:0, cr:0 };
      for(const s of db.s){
        if(near && dist(s.lat, s.lng, near.lat, near.lng) > near.r) continue;
        if(new Date(s.seen_at).getTime() < tt) continue;
        const u = U(s.author); u.n++; if(s.photo_url) u.ph++; u.sp.add(s.species_id); u.cr += s.cc;
      }
      for(const [a, g] of Object.entries(db.gives)) if(by[a]) by[a].cg = since ? Math.round(g / 4) : g;
      if(by.me || db.conf.length) U('me').cg = db.conf.filter(c => c >= tt).length;
      return Object.entries(by).map(([a, u]) => ({
        nickname: a === 'me' ? (db.nickname || t('you')) : a,
        xp: u.n*XP.sighting + u.ph*XP.photo + u.sp.size*XP.newSpecies + u.cg*XP.confirmGiven + u.cr*XP.confirmReceived,
        sightings: u.n, species: u.sp.size, is_me: a === 'me',
      })).filter(x => x.xp > 0).sort((a, b) => b.xp - a.xp).slice(0, 50);
    },
    async getNickname(){ return db.nickname || ''; },
    async setNickname(n){ db.nickname = n; save(); },
  };
}

  const cells = new Set(my.map(s => cellOf(s.lat, s.lng).id));

function questCtx(st){
  const ws = weekStart().getTime(), at = s => new Date(s.seen_at).getTime();

const resolveStyle = id => id === 'auto' ? (isDark() ? 'vt_eclipse' : 'vt_colorful') : id;
const STYLE_FALLBACK = { vt_colorful:'liberty', vt_graybeard:'positron', vt_eclipse:'dark', liberty:'osm', bright:'osm', positron:'osm', dark:'osm', fiord:'osm' };
function isDark(){ const th = document.documentElement.dataset.theme; return th ? th === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }

const loadedScripts = {};
function loadScript(src){ return loadedScripts[src] ||= new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load ' + src)); document.head.appendChild(s); }); }
function loadCss(href){ if(!document.querySelector(`link[href="${href}"]`)){ const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href; document.head.appendChild(l); } }
async function ensureMapLibre(){
  loadCss('https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.css');
  await loadScript('https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.js');
  await loadScript('https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js');
}

let baseSeq = 0;
async function setBase(id = currentStyleId()){
  id = resolveStyle(id);
  const seq = ++baseSeq, s = STYLES.find(x => x.id === id) || STYLES.find(x => x.id === 'osm');
  if(base){ map.removeLayer(base); base = null; }
  document.body.classList.toggle('tiles-invert', !!(s.invertDark && isDark()));
  const fail = () => {
    if(seq !== baseSeq) return;
    if(s.id !== 'osm'){ const next = STYLE_FALLBACK[s.id] || 'osm'; console.warn('map style failed:', s.id, '→', next); setBase(next); }
    else notice(t('tiles_fail'), true);
  };
  if(s.vector){
    // Sprawdzamy, czy serwer stylu odpowiada — działa też w karcie w tle (bez czekania na rysowanie)
    const styleOk = await fetch(s.vector).then(r => r.ok).catch(() => false);
    if(seq !== baseSeq) return;
    if(!styleOk){ fail(); return; }
    try{ await ensureMapLibre(); }catch(e){ fail(); return; }
    if(seq !== baseSeq) return;
    base = L.maplibreGL({ style:s.vector, attribution:s.attr }).addTo(map);
    const gl = base.getMaplibreMap?.();
    let styled = false;
    gl?.on('styledata', () => styled = true);
    gl?.on('error', e => { console.warn('map style error', e?.error?.message || e); if(!styled && seq === baseSeq) fail(); });
    gl?.once('load', repaintBase); setTimeout(repaintBase, 1500);
    return;
  }
  const url = typeof s.raster === 'function' ? s.raster() : s.raster;
  let okT = 0, errT = 0;
  base = L.tileLayer(url, { maxZoom:19, subdomains:s.sub || 'abc', attribution:s.attr })
    .on('tileload', () => okT++)
    .on('tileerror', () => { if(!okT && ++errT >= 4) fail(); })
    .addTo(map);
  setTimeout(() => { if(!okT && seq === baseSeq) fail(); }, 7000);
}
// Wektorowa mapa czasem nie odświeża się po zmianie rozmiaru albo powrocie z tła — wymuszamy przerysowanie
function repaintBase(){
  if(!map) return;
  map.invalidateSize();
  const gl = base?.getMaplibreMap?.();
  if(gl){ gl.resize(); gl.triggerRepaint(); }
}
addEventListener('resize', () => { clearTimeout(repaintBase.t); repaintBase.t = setTimeout(repaintBase, 150); });
addEventListener('orientationchange', () => setTimeout(repaintBase, 300));
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') setTimeout(repaintBase, 100); });
function initialView(){
  const saved = LS.get('dk_view', null);
  if(saved && isFinite(saved.lat)) return saved;
  let tz = ''; try{ tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }catch(e){}
  if(TZ[tz]) return { lat:TZ[tz][0], lng:TZ[tz][1], z:12 };
  if(tz.startsWith('Europe/')) return { lat:50, lng:15, z:5 };
  if(tz.startsWith('America/')) return { lat:39, lng:-98, z:4 };
  return { lat:30, lng:10, z:3 };
}

      gradient:{ .2:'#7cc39a', .5:'#e9c44a', .8:'#e2832b', 1:'#be3f2c' } }).addTo(map);
    if(!list.length) note = t('note_heat_empty');
  } else {
    const moss = css('--moss'), ink2 = css('--ink-2'), vb = map.getBounds().pad(.2);
    const mineCells = new Map(); S.mine.forEach(s => { const c = cellOf(s.lat, s.lng); mineCells.set(c.id, c); });
    const other = new Map(); S.area.forEach(s => { const c = cellOf(s.lat, s.lng); if(!mineCells.has(c.id)) other.set(c.id, c); });
    other.forEach(c => L.rectangle(c.bounds, { color:ink2, weight:1.2, dashArray:'5 6', fillColor:ink2, fillOpacity:.06 }).on('click', () => openCell(c)).addTo(cellsLayer));
    mineCells.forEach(c => { if(vb.contains([c.lat, c.lng])) L.rectangle(c.bounds, { color:moss, weight:2, fillColor:moss, fillOpacity:.3 }).on('click', () => openCell(c)).addTo(cellsLayer); });
    cellsLayer.addTo(map);
    if(z < 12) note = t('note_zoom_cells');
    else if(!mineCells.size) note = t('note_cells_hint');
  }
  $('#emptyNote').textContent = note; $('#emptyNote').hidden = !note;
}

/* ---------- nazwa miejsca (Nominatim) ---------- */
const placeCache = {};
async function placeName(lat, lng){
  const k = LANG + lat.toFixed(3) + ',' + lng.toFixed(3);
  if(k in placeCache) return placeCache[k];
  try{
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=15&accept-language=${LANG}&lat=${lat}&lon=${lng}`);
    const a = (await r.json()).address || {};
    const local = a.park || a.nature_reserve || a.suburb || a.quarter || a.neighbourhood || a.village || a.hamlet || '';
    const city = a.city || a.town || a.municipality || a.county || '';
    return placeCache[k] = [local, city].filter(Boolean).filter((x, i, arr) => arr.indexOf(x) === i).join(', ') || a.country || '';
  }catch(e){ return placeCache[k] = ''; }
}

function xpPreview(){
  const st = myStats(), parts = [`${t('x_sighting')} +${XP.sighting}`];

function compress(file, max, q){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error(t('photo_read_err'))); };
    img.src = url;
  });
}
async function submitForm(){
  if(!F.species){ toast(t('e_species')); return; }
  const spSel = S.spById[F.species], typed = needsTaxon(spSel) ? $('#fTaxon').value.trim() : '';

  if(needsTaxon(spSel) && !F.tx && !F.offline){ toast(t('pick_from_list')); taxonLookup(typed, spSel.name_pl === 'Ptak', false); return; }
  const taxon = F.tx ? F.tx.name : typed, taxon_sci = F.tx?.sci || (LATIN[spSel?.name_pl] || null), taxon_inat = F.tx?.id || null;
  const when = new Date($('#fWhen').value);
  if(isNaN(when)){ toast(t('e_when')); return; }
  if(when > new Date(Date.now() + 60000)){ toast(t('e_future')); return; }
  if(when < new Date(Date.now() - 7*864e5 - 60000)){ toast(t('e_old')); return; }
  const note = $('#fNote').value.trim();
  const behavior = [[...F.behaviors].join(', '), note].filter(Boolean).join(' — ') || null;
  const btn = $('#fSubmit'); btn.disabled = true; btn.textContent = t('saving');
  const before = snapshot(), hadPhoto = !!F.photo, newSp = !before.species.has(F.species);
  try{ await API.add({ species_id:F.species, taxon:taxon || null, taxon_sci, taxon_inat, lat:S.pick.lat, lng:S.pick.lng, behavior, photo_url:F.photo, seen_at:when.toISOString() }); }
  catch(e){ toast(t('save_fail') + ': ' + (e.message || e)); btn.disabled = false; xpPreview(); return; }
  closeSheets();
  if(S.spFilter.size && !S.spFilter.has(F.species)) S.spFilter.clear();
  if(S.time !== 'all' && Date.now() - when > (+S.time) * 864e5) S.time = '30';
  renderChips(); setMode('pins');
  await reload();
  reward(before, 'add', { species:F.species, photo:hadPhoto, newSpecies:newSp ? F.species : null });
}

/* ---------- nagroda ---------- */
function reward(before, kind, extra = {}){
  markProgress();
  const after = snapshot();
  const gained = after.xp - before.xp;
  const newBadges = BADGES.filter(b => after.badges.has(b.id) && !before.badges.has(b.id));
  const qs = weeklyQuests().filter(q => after.quests.has(q.id) && !before.quests.has(q.id));
  const newCells = [...after.cells].filter(c => !before.cells.has(c)).length;
  const lvUp = after.level > before.level;
  renderAll();
  if(kind === 'confirm' && !newBadges.length && !lvUp && !qs.length){ toast(`+${gained} XP`, 'xp'); return; }

  const chips = [];
  if(kind === 'add'){
    chips.push([spIcon(S.spById[extra.species]), `+${XP.sighting}`]);
    if(extra.photo) chips.push(['📷', `+${XP.photo}`]);
    if(extra.newSpecies) chips.push(['🆕', `+${XP.newSpecies}`]);
  } else chips.push(['🤝', `+${XP.confirmGiven}`]);
  if(newCells) chips.push(['🗺️', `${after.cells.size}`]);
  qs.forEach(() => chips.push(['🏁', '✓']));

  const lb = levelOf(before.xp), la = levelOf(after.xp);
  const from = lvUp ? 0 : lb.pct, R = 66, C = 2 * Math.PI * R;
  const perkNow = lvUp ? perkFor(la.idx) : null, perkNext = perkFor(la.idx + 1);

           : `<div class="rw-lv"><b>${esc(la.name)}</b>${la.next ? ` · ${la.toNext} XP → ${esc(perkNext ? '🎁 ' + perkNext[LANG][0] : la.next.name)}` : ''}</div>`}
    ${newBadges.length ? `<div class="newbadges">${newBadges.map(b => `<div class="badge"><div class="medal">${ICON[b.icon]}</div><b>${esc(bName(b))}</b></div>`).join('')}</div>` : ''}
    <button class="btn moss block" id="mOk">${esc(t('next'))}</button></div>`;
  $('#modal').hidden = false;
  $('#mOk').focus();
  $('#mOk').onclick = () => { $('#modal').hidden = true; };

}

    const card = kind === 'card', W = card ? 1080 : 1754, H = card ? 1350 : 1240;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d'), F = (w, s) => `${w} ${s}px 'Nunito', system-ui, sans-serif`;
    const url = location.origin + location.pathname.replace(/index\.html$/, '');
    const spIcons = S.species.filter(s => st.species.has(s.id)).map(spIcon).join(' ');
    const stats = [[st.my.length, pw(st.my.length, 'sighting')], [st.species.size, pw(st.species.size, 'species')], [st.cells.size, 'km²'], [unlocked(st).length, t('badges_h').toLowerCase()]];
    if(card){
      g.fillStyle = '#2D5843'; g.fillRect(0, 0, W, H);
      g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 3;
      for(let i = 0; i < 9; i++){ g.beginPath(); g.ellipse(820, 300, 90 + i * 70, 70 + i * 55, -.3, 0, Math.PI * 2); g.stroke(); }
      g.fillStyle = '#fff'; g.font = F(700, 38); g.fillText(appName().toUpperCase(), 80, 120);
      let fs = 120; g.font = F(800, fs); while(g.measureText(name).width > W - 160 && fs > 48){ fs -= 4; g.font = F(800, fs); }
      g.fillText(name, 80, 400);
      g.fillStyle = '#E2832B'; g.font = F(800, 86); g.fillText(lv.name, 80, 520);
      g.fillStyle = '#fff'; g.font = F(600, 44); g.fillText(`${st.xp} XP`, 80, 600);
      stats.forEach(([n, l], i) => { const x = 80 + (i % 2) * 470, y = 760 + Math.floor(i / 2) * 200;
        g.fillStyle = '#fff'; g.font = F(800, 96); g.fillText(String(n), x, y); g.font = F(500, 40); g.globalAlpha = .8; g.fillText(l, x, y + 56); g.globalAlpha = 1; });
      g.font = '72px sans-serif'; g.fillText(spIcons, 80, 1170);
      g.font = F(500, 32); g.globalAlpha = .75; g.fillText(url, 80, 1270); g.globalAlpha = 1;
    } else {
      g.fillStyle = '#F7F4EC'; g.fillRect(0, 0, W, H);
      g.strokeStyle = '#2D5843'; g.lineWidth = 14; g.strokeRect(50, 50, W - 100, H - 100);
      g.lineWidth = 3; g.strokeRect(80, 80, W - 160, H - 160);
      g.textAlign = 'center'; g.fillStyle = '#2D5843';
      g.font = F(700, 40); g.fillText(appName().toUpperCase(), W / 2, 210);
      g.fillStyle = '#14221A'; g.font = F(800, 92);
      g.fillText(LANG === 'pl' ? 'Certyfikat obserwatora przyrody' : 'Wildlife Observer Certificate', W / 2, 360);
      g.font = F(500, 40); g.fillStyle = '#55665B'; g.fillText(LANG === 'pl' ? 'przyznany dla' : 'awarded to', W / 2, 460);
      g.fillStyle = '#E2832B'; let fs = 110; g.font = F(800, fs); while(g.measureText(name).width > W - 260 && fs > 48){ fs -= 4; g.font = F(800, fs); }
      g.fillText(name, W / 2, 600);
      g.fillStyle = '#14221A'; g.font = F(500, 42);
      const line = LANG === 'pl'
        ? `za ${st.my.length} ${pw(st.my.length, 'sighting')} dzikich zwierząt, ${st.species.size} ${pw(st.species.size, 'species')} i ${st.cells.size} km² zbadanego terenu`
        : `for ${st.my.length} ${pw(st.my.length, 'sighting')} of wild animals, ${st.species.size} species and ${st.cells.size} km² of surveyed area`;
      g.fillText(line, W / 2, 720);
      g.fillText((LANG === 'pl' ? 'Poziom: ' : 'Level: ') + lv.name + ` · ${st.xp} XP`, W / 2, 790);
      g.font = '80px sans-serif'; g.fillText(spIcons, W / 2, 940);
      g.font = F(500, 34); g.fillStyle = '#55665B';
      g.fillText(new Date().toLocaleDateString(LOCALE(), { day:'numeric', month:'long', year:'numeric' }) + '  ·  ' + url, W / 2, 1090);
    }
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    const file = new File([blob], (card ? 'tracker-card' : 'certificate') + '.png', { type:'image/png' });
    if(navigator.canShare?.({ files:[file] })){ try{ await navigator.share({ files:[file], title:appName() }); return; }catch(e){ if(e.name === 'AbortError') return; } }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }catch(e){ console.error(e); toast(t('share_fail')); }
}

let sT;
function initSearch(){
  const q = $('#q'), box = $('#results');
  q.addEventListener('input', () => {
    clearTimeout(sT); const v = q.value.trim();
    if(v.length < 3){ box.hidden = true; return; }
    sT = setTimeout(async () => {
      try{
        const b = map.getBounds();
        const vb = map.getZoom() >= 8 ? `&viewbox=${b.getWest()},${b.getNorth()},${b.getEast()},${b.getSouth()}` : '';
        const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=6&accept-language=${LANG}${vb}&q=${encodeURIComponent(v)}`);
        const d = await r.json();
        box.innerHTML = d.length ? d.map(x => `<button data-ll="${x.lat},${x.lon}" data-bb="${(x.boundingbox || []).join(',')}">${esc(x.display_name.split(',').slice(0, 3).join(','))}</button>`).join('') : `<button disabled>${esc(t('no_results'))}</button>`;
        box.hidden = false;
        $$('#results [data-ll]').forEach(btn => btn.onclick = () => {
          const bb = btn.dataset.bb.split(',').map(Number);
          if(bb.length === 4 && bb.every(isFinite)) map.fitBounds([[bb[0], bb[2]], [bb[1], bb[3]]], { maxZoom:16 });
          else { const [a, o] = btn.dataset.ll.split(',').map(Number); map.setView([a, o], 15); }
          box.hidden = true; q.blur();
        });
      }catch(e){ box.innerHTML = `<button disabled>${esc(t('search_down'))}</button>`; box.hidden = false; }
    }, 500);
  });
  q.addEventListener('blur', () => setTimeout(() => box.hidden = true, 200));
}
function locate(silent){
  if(!navigator.geolocation){ if(!silent) toast(t('geo_none')); return; }
  navigator.geolocation.getCurrentPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude]; map.setView(ll, 14);
    if(!meDot) meDot = L.marker(ll, { icon:L.divIcon({ className:'', iconSize:[18,18], html:'<div class="medot"></div>' }), interactive:false, zIndexOffset:-100 }).addTo(map);
    else meDot.setLatLng(ll);
  }, () => {
    if(silent) return;
    if(location.protocol !== 'https:' && !/^(localhost|127\.)/.test(location.hostname)) toast(t('geo_https'));
    else toast(t('geo_denied'));
  }, { enableHighAccuracy:true, timeout:10000, maximumAge:60000 });
}
async function locateIfAllowed(){
  try{ const p = await navigator.permissions?.query({ name:'geolocation' }); if(p?.state === 'granted') locate(true); }catch(e){}
}

];
let onbStep = 0;
function openOnboarding(){ onbStep = 0; $('#onb').hidden = false; renderOnb(); }
function renderOnb(){
  const s = SLIDES[onbStep], eyebrow = t(s.k + '_e') || appName();
  const langChips = `<div class="bchips" style="justify-content:flex-end">${[['pl','PL'],['en','EN']].map(([v, l]) => `<button class="chip${LANG === v ? ' on' : ''}" data-onblang="${v}" style="height:30px">${l}</button>`).join('')}</div>`;
  $('#onbIn').innerHTML = `
    ${onbStep === 0 ? langChips : ''}
    ${s.art ? `<div class="onb-art">${s.art}</div>` : ''}
    <div class="dots" aria-label="${esc(t('step'))} ${onbStep + 1} / ${SLIDES.length}">${SLIDES.map((_, i) => `<i class="${i === onbStep ? 'on' : ''}"></i>`).join('')}</div>
    <div style="display:flex;flex-direction:column;gap:10px"><div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(t(s.k + '_t'))}</h1><p>${esc(t(s.k + '_p'))}</p></div>
    ${s.last ? `
      <div class="field"><label for="onbNick">${esc(t('nick_l'))}</label><input class="input" id="onbNick" maxlength="24" placeholder="${esc(t('onb_nick_ph'))}" value="${esc(S.nickname)}"></div>
      <label class="consent"><input type="checkbox" id="onbOk"><span>${esc(t('consent'))} <a href="../privacy.html" target="_blank" rel="noopener">${esc(t('privacy_link'))}</a></span></label>
      <p style="font-size:13px">${esc(t('emergency'))} ${esc(EMERG[LANG])}.</p>` : ''}
    <div class="btns" style="margin-top:auto">
      ${onbStep ? `<button class="btn ghost" id="onbBack">${esc(t('back'))}</button>` : ''}
      <button class="btn ${s.last ? 'primary' : 'moss'}" id="onbNext"${s.last ? ' disabled' : ''}>${esc(s.last ? t('onb_go') : t('next'))}</button></div>`;
  $$('[data-onblang]').forEach(b => b.onclick = () => { setLang(b.dataset.onblang); renderOnb(); });
  $('#onbBack') && ($('#onbBack').onclick = () => { onbStep--; renderOnb(); });
  if(s.last){
    $('#onbOk').onchange = e => { $('#onbNext').disabled = !e.target.checked; };
    $('#onbNext').onclick = async () => {
      const n = $('#onbNick').value.trim();
      if(n && n.length < 2){ toast(t('nick_short')); return; }
      if(n && n !== S.nickname){ try{ await API.setNickname(n); S.nickname = n; }catch(e){ toast(t('nick_fail') + ': ' + (e.message || e)); } }
      LS.set('dk_onb_v4', true); $('#onb').hidden = true; renderHud();
      locate(false);
    };
  } else $('#onbNext').onclick = () => { onbStep++; renderOnb(); };
}

/* =====================================================================
   START
   ===================================================================== */
async function loadMine(){ const m = await API.mine(); S.mine = m.list; S.myConf = m.conf; }
async function reload(){ await Promise.all([loadMine(), loadArea()]); }

function bindStatic(){
  $('#icoSearch').innerHTML = ICON.search;
  $('#locate').innerHTML = ICON.locate;
  $('#noticeClose').innerHTML = ICON.close;
  $('#addBtn span').innerHTML = ICON.plus;
  const tabIcons = { map:'map', quests:'flag', atlas:'book', rank:'trophy' };
  $$('.tab').forEach(b => { b.querySelector('.ic').innerHTML = ICON[tabIcons[b.dataset.tab]]; b.onclick = () => setTab(b.dataset.tab === S.tab && b.dataset.tab !== 'map' ? 'map' : b.dataset.tab); });
  $$('[data-close]').forEach(b => { b.innerHTML = ICON.close; b.onclick = closeSheets; });
  $$('[data-tabclose]').forEach(b => { b.innerHTML = ICON.close; b.onclick = () => setTab('map'); });
  $('#scrim').onclick = closeSheets;
  $('#noticeClose').onclick = () => { $('#notice').hidden = true; };
  $('#meChip').onclick = () => setTab('atlas');
  $('#locate').onclick = () => locate(false);
  $('#addBtn').onclick = () => startAdd();
  $('#addCancel').onclick = stopAdd;
  $('#addOk').onclick = () => { const c = map.getCenter(); S.pick = { lat:c.lat, lng:wrap(c.lng) }; stopAdd(); openForm(); };
  $$('.seg button[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  $('#modal').onclick = e => { if(e.target.id === 'modal') $('#modal').hidden = true; };
  document.addEventListener('keydown', e => { if(e.key !== 'Escape') return; if(!$('#modal').hidden) $('#modal').hidden = true; else if(S.adding) stopAdd(); else if($('.sheet.open:not(.panel)')) closeSheets(); else setTab('map'); });
  initSearch();
}

async function boot(){
  applyStatic();
  bindStatic();
  if(!window.L){ notice(t('lib_fail'), true); return; }
  initMap();
  const start = async () => {
    API = DEMO ? demoApi() : supaApi();
    await API.init();
    const sp = await API.species();
    S.species = sp.sort((a, b) => (SP_ORDER.indexOf(a.name_pl) + 1 || 99) - (SP_ORDER.indexOf(b.name_pl) + 1 || 99));
    S.spById = {}; S.species.forEach(s => S.spById[s.id] = s);
    await reload();
    S.nickname = await API.getNickname();
  };
  try{
    await start();
    if(DEMO) notice(t('demo_notice'));
  }catch(e){
    console.error(e);
    if(!DEMO){
      DEMO = true;
      notice(t('db_fallback'), true);
      try{ await start(); }catch(e2){ console.error(e2); }
    } else notice(t('start_fail') + ': ' + (e.message || e), true);
  }
  renderChips(); renderAll();
  if(!LS.get('dk_onb_v4', false)) openOnboarding(); else locateIfAllowed();
  if('serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.)/.test(location.hostname)))
    navigator.serviceWorker.register('sw.js').catch(() => {});
}
boot();
</script>
