<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Nunito:wght@400..800&display=swap">
<style>
:root{--moss:#2D5843;--moss2:#173426;--fox:#E2832B;--cream:#F7F1E6;--ink:#14221A;--ink2:#55665B;--soft:#DCE8DF}
*{box-sizing:border-box;margin:0}
body{font-family:'Nunito',sans-serif;color:var(--ink)}
.ad{position:relative;overflow:hidden;display:flex;flex-direction:column}
.sq{width:1080px;height:1080px}.st{width:1080px;height:1920px}
h1{font:600 92px/1.02 'Fredoka';letter-spacing:-.01em}
.sub{font:500 40px/1.3 'Nunito'}
.cta{display:inline-flex;align-items:center;gap:18px;background:var(--fox);color:#211204;border-radius:999px;padding:26px 46px;font:600 44px 'Fredoka';box-shadow:0 14px 30px -10px #E2832B99}
.logo{display:flex;align-items:center;gap:16px;font:600 44px 'Fredoka'}
.logo img{width:68px;height:68px;border-radius:18px;box-shadow:0 6px 14px -6px #0006}
.rings{position:absolute;inset:0;pointer-events:none}
/* telefon */
.phone{position:absolute;width:420px;height:880px;border-radius:64px;background:#0d1410;padding:14px;box-shadow:0 40px 80px -30px #0009,0 0 0 2px #ffffff22}
.scr{color:#14221A;position:relative;width:100%;height:100%;border-radius:52px;overflow:hidden;background:url(src/map_crop.jpg) center/cover}
.scr .top{position:absolute;left:14px;right:14px;top:40px;display:flex;gap:8px}
.scr .srch{flex:1;height:46px;border-radius:15px;background:#fff;box-shadow:0 2px 8px #0002;display:flex;align-items:center;padding:0 12px;font:500 15px 'Nunito';color:#55665B}
.scr .me{height:46px;border-radius:15px;background:var(--moss);color:#fff;display:flex;align-items:center;gap:8px;padding:0 12px;font:600 14px/1.1 'Fredoka'}
.scr .me b{width:28px;height:28px;border-radius:50%;border:3px solid var(--fox);display:grid;place-items:center;font-size:13px}
.scr .chips{position:absolute;left:14px;top:96px;display:flex;gap:6px}
.scr .chip{height:34px;border-radius:12px;background:#fff;box-shadow:0 2px 6px #0002;display:flex;align-items:center;gap:5px;padding:0 11px;font:500 14px 'Fredoka'}
.scr .chip.on{background:var(--moss);color:#fff}
.pin{position:absolute;width:52px;height:52px;border-radius:50%;background:#fff;border:3px solid var(--moss);display:grid;place-items:center;font-size:27px;box-shadow:0 4px 10px #0003;transform:translate(-50%,-50%)}
.pin.d2{border-color:var(--fox)}
.pin.fresh::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--fox);opacity:.6}
.scr .tabs{position:absolute;left:0;right:0;bottom:0;height:86px;background:#fff;display:flex;justify-content:space-around;align-items:center;padding:0 10px 12px;font:500 11px 'Fredoka';color:#55665B}
.scr .tabs span{display:flex;flex-direction:column;align-items:center;gap:3px}
.scr .fab{width:62px;height:62px;border-radius:20px;background:var(--fox);display:grid;place-items:center;font:500 40px/1 'Fredoka';color:#211204;margin-top:-34px;box-shadow:0 8px 18px #E2832B66}
.scr .attr{position:absolute;right:8px;bottom:90px;font:500 9px 'Nunito';color:#55665Bcc;background:#fff9;padding:1px 5px;border-radius:5px}
.bubble{color:#14221A;position:absolute;background:#fff;border-radius:26px;padding:18px 24px;box-shadow:0 20px 40px -14px #0005;font:600 28px/1.15 'Fredoka';display:flex;align-items:center;gap:14px}
.bubble small{display:block;font:500 21px 'Nunito';color:var(--ink2)}
.bubble .e{font-size:46px}
.emo{position:absolute;display:grid;place-items:center;border-radius:50%;background:#fff;box-shadow:0 18px 40px -16px #0006}
.opt{background:#fff;border-radius:26px;padding:28px 34px;font:600 40px 'Fredoka';border:4px solid transparent;box-shadow:0 10px 24px -14px #0005}
.opt.ok{border-color:#3B8A5A}
.tag{display:inline-block;background:#ffffff22;color:#fff;border-radius:999px;padding:10px 22px;font:600 30px 'Fredoka'}
</style></head><body>
<div id="root"></div>
<script>
const q = new URLSearchParams(location.search), C = q.get('c'), FMT = q.get('f'), ST = FMT === 'st';
const rings = (cx, cy, n = 10, op = .08) => `<svg class="rings" viewBox="0 0 1080 ${ST ? 1920 : 1080}">${[...Array(n)].map((_, i) => `<ellipse cx="${cx}" cy="${cy}" rx="${90 + i * 80}" ry="${70 + i * 62}" fill="none" stroke="rgba(255,255,255,${op})" stroke-width="3" transform="rotate(-20 ${cx} ${cy})"/>`).join('')}</svg>`;
const phone = (x, y, s = 1, extra = '') => `<div class="phone" style="left:${x}px;top:${y}px;transform:scale(${s});transform-origin:top left"><div class="scr">
  <div class="top"><div class="srch">🔍&nbsp; Miasto lub adres</div><div class="me"><b>2</b><span>Tropiciel<br><small style="font:500 12px Nunito;opacity:.8">143 XP</small></span><span style="color:#F29C4B">🔥5</span></div></div>
  <div class="chips"><div class="chip">🕒 7 dni</div><div class="chip on">Wszystkie</div><div class="chip">🐦 Ptak</div><div class="chip">🦔 Jeż</div></div>
  <div class="pin d2 fresh" style="left:30%;top:33%">🐗</div>
  <div class="pin" style="left:76%;top:30%">🐿️</div>
  <div class="pin" style="left:22%;top:68%">🦔</div>
  <div class="pin" style="left:52%;top:42%">🐦</div>
  <div class="pin" style="left:83%;top:76%">🐦</div>
  <div class="pin" style="left:44%;top:83%">🦆</div>
  ${extra}
  <div class="attr">© OpenStreetMap</div>
  <div class="tabs"><span>🗺️<br>Mapa</span><span>🏁<br>Wyzwania</span><div class="fab">+</div><span>📖<br>Atlas</span><span>🏆<br>Ranking</span></div>
</div></div>`;
const logo = (color = '#fff') => `<div class="logo" style="color:${color}"><img src="src/icon.png" alt="">Tropami</div>`;
const A = {
  // 1. Dzik pod blokiem?
  A(){ return `<div class="ad ${FMT}" style="background:linear-gradient(160deg,#2D5843,#173426);color:#fff;padding:${ST ? '240px 80px 300px' : '70px 70px'}">
    ${rings(ST ? 900 : 900, ST ? 1500 : 820, 11)}
    ${logo()}
    <h1 style="margin-top:${ST ? 90 : 46}px;max-width:${ST ? 920 : 560}px;font-size:${ST ? 112 : 84}px">Dzik pod blokiem? Lis na podwórku?</h1>
    <p class="sub" style="margin-top:28px;max-width:${ST ? 900 : 520}px;opacity:.88">Zaznacz go na mapie dzikich zwierząt w Twoim mieście — w 10 sekund.</p>
    <div style="margin-top:${ST ? 60 : 'auto'}"><span class="cta">tropami.com →</span></div>
    ${ST ? phone(330, 980, 1.65) : phone(600, 150, 1.02)}
    ${ST ? `<div class="bubble" style="left:70px;top:1330px"><span class="e">🐗</span><span>Dzik · 3 sztuki<small>Ruczaj · 12 min temu</small></span></div>` : `<div class="bubble" style="left:420px;top:700px"><span class="e">🐗</span><span>Dzik · 3 sztuki<small>Ruczaj · 12 min temu</small></span></div>`}
  </div>`; },
  // 2. Kto mieszka na Twoim osiedlu?
  B(){ const E = ST ? [['🦔',230,760,200],['🐿️',560,680,180],['🦊',860,820,210],['🐦',380,1020,160],['🐗',720,1080,190],['🦉',170,1230,120],['🦆',930,1270,120]]
                  : [['🦔',200,330,170],['🐿️',520,290,150],['🦊',850,360,180],['🐦',330,560,130],['🐗',680,560,160],['🦆',940,600,100]];
    return `<div class="ad ${FMT}" style="background:#F7F1E6;padding:${ST ? '240px 80px 300px' : '70px'}">
    <svg class="rings" viewBox="0 0 1080 ${ST ? 1920 : 1080}">${[...Array(9)].map((_, i) => `<ellipse cx="540" cy="${ST ? 960 : 560}" rx="${120 + i * 90}" ry="${90 + i * 70}" fill="none" stroke="rgba(45,88,67,.09)" stroke-width="3"/>`).join('')}</svg>
    ${logo('#2D5843')}
    <h1 style="margin-top:${ST ? 60 : 26}px;color:#2D5843;font-size:${ST ? 104 : 76}px;max-width:${ST ? 920 : 900}px">Kto mieszka na Twoim osiedlu?</h1>
    ${E.map(([e, x, y, d]) => `<div class="emo" style="left:${x - d / 2}px;top:${y - d / 2 + (ST ? 0 : 60)}px;width:${d}px;height:${d}px;font-size:${d * .55}px">${e}</div>`).join('')}
    <div style="position:absolute;left:${ST ? 80 : 70}px;right:${ST ? 80 : 70}px;bottom:${ST ? 320 : 66}px">
      <p class="sub" style="color:#14221A;margin-bottom:34px;font-size:${ST ? 44 : 36}px">Jeże, wiewiórki, lisy, ptaki. Zobacz, kogo spotykają sąsiedzi, i dodaj własne obserwacje.</p>
      <span class="cta">Sprawdź na tropami.com</span></div>
  </div>`; },
  // 3. Zagadka
  C(){ return `<div class="ad ${FMT}" style="background:linear-gradient(170deg,#DCE8DF,#C9DCCF);padding:${ST ? '240px 80px 320px' : '64px 70px'}">
    ${logo('#2D5843')}
    <div style="margin-top:${ST ? 120 : 34}px"><span class="tag" style="background:#2D5843">🦉 Zagadka dnia</span></div>
    <h1 style="margin-top:${ST ? 40 : 24}px;font-size:${ST ? 96 : 70}px;color:#14221A">Jaki dźwięk wydaje lis zimą?</h1>
    <div style="display:flex;flex-direction:column;gap:${ST ? 26 : 16}px;margin-top:${ST ? 70 : 34}px">
      <div class="opt" style="${ST ? '' : 'padding:24px 32px;font-size:38px'}">A. Mruczy jak kot</div>
      <div class="opt" style="${ST ? '' : 'padding:24px 32px;font-size:38px'}">B. Przenikliwie krzyczy</div>
      <div class="opt" style="${ST ? '' : 'padding:24px 32px;font-size:38px'}">C. Gwiżdże</div></div>
    <div style="position:absolute;right:${ST ? 60 : 60}px;top:${ST ? 250 : 60}px;font-size:${ST ? 190 : 150}px;transform:rotate(8deg);filter:drop-shadow(0 20px 30px #0003)">🦊</div>
    <div style="margin-top:auto">
      <p class="sub" style="font-size:${ST ? 42 : 32}px;margin-bottom:28px;color:#14221A">Odpowiedź w aplikacji Tropami. Codziennie nowa zagadka o zwierzętach w mieście.</p>
      <span class="cta">Zagraj na tropami.com</span></div>
  </div>`; },
  // 4. Ślady też się liczą (story card)
  D(){ return `<div class="ad ${FMT}" style="background:#173426;color:#fff;padding:${ST ? '240px 80px 300px' : '70px'}">
    ${rings(200, ST ? 300 : 200, 10, .06)}
    ${logo()}
    <h1 style="margin-top:${ST ? 70 : 40}px;font-size:${ST ? 104 : 78}px;max-width:${ST ? 920 : 520}px">Rozkopany trawnik? To ślady dzika.</h1>
    <p class="sub" style="margin-top:26px;max-width:${ST ? 900 : 480}px;opacity:.88;font-size:${ST ? 42 : 34}px">Ślady też zgłaszasz. Nie musisz podchodzić do zwierzęcia — z daleka jest bezpieczniej.</p>
    <div style="margin-top:${ST ? 60 : 'auto'}"><span class="cta">tropami.com →</span></div>
    <img src="src/story.png" style="position:absolute;${ST ? 'left:290px;top:1010px;width:520px' : 'right:60px;top:110px;width:440px'};border-radius:36px;box-shadow:0 40px 80px -30px #000c;transform:rotate(${ST ? -3 : 3}deg)">
  </div>`; },
};
document.getElementById('root').innerHTML = A[C]();
</script></body></html>
